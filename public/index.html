<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Your AI Spoken Mate</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #58cc02; --primary-dark: #46a302; --blue: #1cb0f6; --bg: #ffffff; --font: 'Nunito', sans-serif; }
        body { font-family: var(--font); margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #333; }

        /* Screens */
        #home-screen, #scenario-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #scenario-screen { display: none; overflow-y: auto; justify-content: start; }

        /* Typography */
        .brand { font-family: 'Fredoka', sans-serif; font-size: 42px; color: var(--primary); margin-bottom: 5px; }
        .tagline { background: #fff9c4; color: #f57f17; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; margin-bottom: 30px; border: 1px dashed #fbc02d; line-height: 1.4; max-width: 320px; }
        
        /* Interactive Elements */
        .btn-main { width: 100%; max-width: 300px; padding: 16px; background: var(--primary); border: none; border-bottom: 4px solid var(--primary-dark); color: white; font-size: 18px; font-weight: 800; border-radius: 16px; cursor: pointer; text-transform: uppercase; }
        .sc-grid { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .role-card { border: 2px solid #f0f0f0; border-radius: 20px; padding: 20px; cursor: pointer; text-align: center; background: white; transition: 0.2s; box-shadow: 0 4px 0 #f0f0f0; }
        .role-card:active { transform: translateY(4px); box-shadow: none; border-color: var(--blue); }

        /* Chat UI */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .top-nav { padding: 12px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #fff; }
        .bubble { max-width: 85%; padding: 14px 18px; border-radius: 22px; font-size: 16px; line-height: 1.5; font-weight: 600; animation: msgSlide 0.3s ease-out; }
        .ai { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
        .user { background: var(--blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; border-bottom: 4px solid #1899d6; }
        
        .typing { font-size: 12px; color: #aaa; margin: 0 0 10px 25px; font-weight: bold; display: none; }
        .input-area { padding: 15px 20px 30px 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center; }
        #userInput { flex: 1; background: #f7f7f7; border: 1px solid #eee; padding: 15px 20px; border-radius: 30px; outline: none; font-size: 16px; font-weight: 600; font-family: inherit; }
        #mic-btn { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @keyframes msgSlide { from {opacity: 0; transform: translateY(15px);} to {opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body>

<audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"></audio>

<div id="home-screen">
    <div class="brand">Talk24AI</div>
    <div class="tagline">No Partner to Practice? <br> Meet Talk24AI: Your 24/7 Spoken English Mate.</div>
    <div style="width: 100%; max-width: 300px; display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="number" id="age" value="18" style="width:50%; padding:15px; border-radius:15px; border:2px solid #eee; text-align:center; font-weight:900;">
        <select id="gender" style="width:50%; padding:15px; border-radius:15px; border:2px solid #eee; font-weight:900;">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
    </div>
    <button class="btn-main" onclick="showScenarios()">Find My Mate</button>
</div>

<div id="scenario-screen">
    <div style="font-size: 22px; font-weight: 900; margin-bottom: 20px;">Choose Your Roleplay</div>
    <div class="sc-grid" id="role-grid"></div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div style="display:flex; align-items:center; gap:12px;">
            <div id="p-icon" style="font-size: 28px;">🤖</div>
            <div style="font-weight: 800; font-size: 17px;" id="p-name">AI Mate</div>
        </div>
        <div style="background: #fff4db; color: #d68f00; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px;">⭐ <span id="score">0</span></div>
    </div>
    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is thinking...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Speak to your mate..." onkeypress="handleEnter(event)">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>
</div>

<script>
    const scenarios = {
        junior: [
            { name: "Islamic Storyteller", icon: "🕌", prompt: "Tell inspiring stories of Islamic Heroes like Khalid bin Walid or Ali (RA). End with a question for the kid." },
            { name: "English Teacher", icon: "👩‍🏫", prompt: "Be a kind teacher. Ask about school. Correct very gently in brackets." },
            { name: "Best Friend", icon: "🏸", prompt: "Talk about cricket or toys. Use very simple friendly English." }
        ],
        senior: [
            { name: "History Explorer", icon: "📜", prompt: "Discuss Islamic Golden Age inventions or History of Mecca. Be intellectual." },
            { name: "Job Interviewer", icon: "💼", prompt: "Start the interview immediately. Ask: 'Tell me about yourself'. No intro." },
            { name: "IELTS Examiner", icon: "🇬🇧", prompt: "Conduct a formal IELTS Speaking test Part 1. Focus on fluency." },
            { name: "Foreign Friend", icon: "🌏", prompt: "You are a traveler in Dhaka. Ask about local food and culture." }
        ]
    };

    let state = { age: 18, gender: 'Male', currentRole: null, score: 0 };
    let isMicOn = false;

    function showScenarios() {
        state.age = document.getElementById('age').value;
        const list = (state.age < 13) ? scenarios.junior : scenarios.senior;
        const grid = document.getElementById('role-grid');
        grid.innerHTML = ''; 
        list.forEach(role => {
            const div = document.createElement('div');
            div.className = 'role-card';
            div.innerHTML = `<div style="font-size:40px; margin-bottom:10px;">${role.icon}</div><div style="font-weight:900;">${role.name}</div>`;
            div.onclick = () => startChat(role);
            grid.appendChild(div);
        });
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('scenario-screen').style.display = 'flex';
    }

    function startChat(role) {
        state.currentRole = role;
        document.getElementById('p-icon').innerText = role.icon;
        document.getElementById('p-name').innerText = role.name;
        document.getElementById('scenario-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const sysPrompt = `IDENTITY: ${state.currentRole.name}. CONTEXT: ${state.currentRole.prompt}. RULE: START THE ROLEPLAY IMMEDIATELY. NO PREAMBLE. ENGLISH ONLY.`;
        callAPI({ message: "START_ROLEPLAY", systemInstruction: sysPrompt });
    }

    async function sendToAI(text) {
        addUserMsg(text);
        document.getElementById('userInput').value = '';
        toggleTyping(true);

        const expertPrompt = `
            ACT AS: ${state.currentRole.name}.
            STRICT RULES:
            1. BANGLADESHI CONTEXT: You are a mate from Bangladesh. No conflicting with Islam/Iman.
            2. NO PREAMBLE: Never say "As-salamu alaykum" if not relevant. Never say "To start...".
            3. NO LECTURES: Do not explain grammar rules.
            4. CORRECTION: Only if major error, put 1-2 words in brackets e.g. (Correct: I went).
            5. ENGAGEMENT: Always end with a short, curiosity-inducing question.
            6. COMPLETENESS: Ensure every sentence is complete and logical. Never cut off.
        `;

        callAPI({ message: text, systemInstruction: expertPrompt });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            toggleTyping(false);
            
            // Cleanup and Fallback for Blank Messages
            let reply = data.reply.replace(/[\u0980-\u09FF].*/g, '').trim(); 
            if(reply.length < 5) reply = "That's interesting! Could you tell me more about that?"; // Fallback

            addAiMsg(reply);
        } catch (e) { toggleTyping(false); }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    function addAiMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble ai'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom(); speak(text);
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
        document.getElementById('snd-pop').play().catch(e=>{});
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition(); recognition.lang = 'en-US';
    function toggleMic() {
        if(!isMicOn) { recognition.start(); document.getElementById('mic-btn').classList.add('listening'); isMicOn = true; }
        else { recognition.stop(); document.getElementById('mic-btn').classList.remove('listening'); isMicOn = false; }
    }
    recognition.onresult = (e) => { sendToAI(e.results[0][0].transcript); toggleMic(); };
</script>
</body>
</html>
