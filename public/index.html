<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Spoken English Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --bg: #002b20; --card: #001e17; --input: #00382e; --cyan: #00ffcc; --gray: #aabeb8; 
            --fire: #ff4500; --gold: #ffd700;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; overflow: hidden; user-select: none; }

        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; z-index: 5000; }
        .active-screen { display: flex; }
        .hero-card { width: 100%; max-width: 550px; background: var(--card); border: 2px solid #004d40; border-radius: 25px; padding: 25px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        /* --- 📊 TOP NAV & PROGRESS --- */
        .top-nav { padding: 15px 20px; display: flex; align-items: center; width: 100%; max-width: 600px; gap: 12px; background: var(--bg); border-bottom: 1px solid #004d40; }
        .progress-track { flex: 1; height: 8px; background: #00382e; border-radius: 5px; }
        .progress-fill { height: 100%; background: var(--cyan); border-radius: 5px; transition: width 0.5s; box-shadow: 0 0 10px var(--cyan); }
        .badge { background: var(--input); border: 1.5px solid var(--cyan); padding: 5px 10px; border-radius: 8px; color: var(--cyan); font-weight: 900; font-size: 11px; }
        .streak-box { display: flex; align-items: center; gap: 4px; color: var(--fire); font-weight: 900; font-size: 14px; }

        /* --- 💬 MESSAGES --- */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 600px; padding-bottom: 150px; scroll-behavior: smooth; }
        .bubble { padding: 12px 16px; border-radius: 15px; font-size: 15px; max-width: 85%; }
        .ai-bubble { background: var(--input); align-self: flex-start; border: 1px solid #004d40; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); align-self: flex-end; }
        .assessment-card { margin-top: 10px; padding: 12px; border: 1.5px solid var(--cyan); border-radius: 12px; font-size: 11px; color: var(--cyan); font-weight: 800; background: rgba(0, 255, 204, 0.05); }
        .mentor-note { margin-top: 8px; font-size: 12px; color: var(--gray); border-left: 3px solid var(--cyan); padding-left: 10px; font-style: italic; background: rgba(0,0,0,0.1); padding: 8px; border-radius: 5px; }

        /* --- 🎙️ VOICE BOTTOM --- */
        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 25px; background: linear-gradient(to top, var(--bg) 80%, transparent); display: flex; justify-content: center; backdrop-filter: blur(10px); }
        #mic-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--input); border: 4px solid var(--cyan); color: var(--cyan); font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
        #mic-btn.listening { background: #ff2e63; border-color: #ff2e63; color: white; animation: pulse 1s infinite; }
        .mic-bonus-badge { position: absolute; top: -10px; right: -10px; background: var(--gold); color: black; font-size: 9px; padding: 3px 6px; border-radius: 6px; font-weight: 900; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,46,99,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,46,99,0); } }

        /* --- 🔘 CHOICE BOX --- */
        .choice-box { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .choice-btn { background: transparent; border: 1.5px solid var(--cyan); color: var(--cyan); padding: 10px 18px; border-radius: 25px; font-size: 13px; font-weight: 800; cursor: pointer; }
        .xp-hint { font-size: 10px; color: #ff8c00; font-weight: 800; margin-top: 8px; }

        /* --- 📚 TOPIC LIST --- */
        .topic-scroll { flex: 1; overflow-y: auto; width: 100%; margin-top: 10px; }
        .topic-group { background: #00382e; color: var(--cyan); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 900; margin: 15px 0 10px 0; border-left: 4px solid var(--cyan); }
        .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .topic-btn { background: rgba(255,255,255,0.05); border: 1px solid #004d40; padding: 15px; border-radius: 12px; color: white; font-size: 13px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
<audio id="snd-levelup" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<div id="home-screen" class="screen active-screen">
    <div style="font-family:'Fredoka'; color:var(--cyan); font-size:40px; margin-bottom:20px;">Talk24AI</div>
    <div class="hero-card">
        <div style="font-weight:900; color:var(--gray); font-size:12px; text-transform:uppercase; text-align:center;">Choose Your English Mission</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <button onclick="loadTopics('A')" style="padding:30px 10px; border-radius:20px; background:var(--input); color:var(--cyan); border:none; cursor:pointer; font-weight:900; font-size:18px;">BEGINNER</button>
            <button onclick="loadTopics('B')" style="padding:30px 10px; border-radius:20px; background:var(--input); color:var(--cyan); border:none; cursor:pointer; font-weight:900; font-size:18px;">LEARNER</button>
            <button onclick="loadTopics('C')" style="padding:30px 10px; border-radius:20px; background:var(--input); color:var(--cyan); border:none; cursor:pointer; font-weight:900; font-size:18px;">HESITANT</button>
            <button onclick="loadTopics('D')" style="padding:30px 10px; border-radius:20px; background:var(--input); color:var(--cyan); border:none; cursor:pointer; font-weight:900; font-size:18px;">PRO</button>
        </div>
    </div>
</div>

<div id="topic-screen" class="screen">
    <div class="hero-card">
        <button onclick="location.reload()" style="background:transparent; color:var(--gray); border:1.5px solid #444; padding:8px 20px; border-radius:10px; align-self:flex-start; cursor:pointer; font-weight:800;">← BACK</button>
        <div id="topic-container" class="topic-scroll"></div>
    </div>
</div>

<div id="chat-screen" class="screen" style="padding:0; justify-content:flex-start;">
    <div class="top-nav">
        <div class="badge" id="chat-lvl">LVL 1</div>
        <div class="streak-box" id="streak-display">🔥 0</div>
        <div class="progress-track"><div class="progress-fill" id="xp-bar"></div></div>
        <button onclick="downloadReport()" style="background:var(--cyan); border:none; padding:8px 12px; border-radius:8px; font-weight:900; font-size:10px; color:#001e17;">💾 REPORT</button>
    </div>
    <div id="messages"></div>
    <div class="bottom-area">
        <div class="voice-deck">
            <button id="mic-btn" onclick="toggleMic()">🎙️ <span class="mic-bonus-badge">2X XP</span></button>
            <div style="font-size: 10px; color: var(--gray); font-weight: 800; text-transform: uppercase;">Speak for Double Points</div>
        </div>
    </div>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com"; 
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);
    
    // 📘 FULL 400-TOPIC DATA
    const FULL_SYLLABUS = {
        'A': [
            {title:"1-10: GREETINGS", items:["Hello & Hi","Good Morning","Good Night","My Name","My Age","Boy or Girl?","How are you?","I am Fine","Goodbye","Thank You"]},
            {title:"11-20: FAMILY", items:["Mother","Father","Brother","Sister","Baby","Grandpa","Grandma","Uncle","Aunt","Cousin"]},
            {title:"21-30: COLORS", items:["Red Apple","Blue Sky","Green Grass","Yellow Sun","Orange Fruit","Black Hair","White Teeth","Pink Flower","Brown Bear","Purple Dress"]},
            {title:"31-40: NUMBERS", items:["One to Five","Six to Ten","Phone Number","Counting Fingers","Counting Chairs","First & Second","Big & Small","Tall & Short","Heavy & Light","Fast & Slow"]},
            {title:"41-100: MORE", items:["Body Parts","Animals","Food & Drink","House","School Objects","Actions"]}
        ],
        'B': [
            {title:"1-10: SCHOOL LIFE", items:["My School","Favorite Teacher","Best Friend","Homework","Exam Fear","Lunch Break","School Bus","Library","Sports Day","Late for Class"]},
            {title:"11-20: HOBBIES", items:["Cricket","Football","Mobile Games","Drawing","Singing","Dancing","Storybooks","Cycling","Swimming","Gardening"]},
            {title:"21-100: MORE", items:["Technology","Restaurants","Daily Routine","Emotions","Shopping","Travel","Weather","Social Skills"]}
        ],
        'C': [
            {title:"1-10: IELTS TOPICS", items:["Hometown","Work or Study","Accommodation","Neighbors","Transport","Weather Choice","Gift Giving","Mirrors","Robots","Leisure Time"]},
            {title:"11-20: SOCIAL ISSUES", items:["Traffic Jams","Pollution","Global Warming","Unemployment","Poverty","Corruption","Gender Equality","Mental Health","Fast Fashion","Plastic Ban"]},
            {title:"21-100: MORE", items:["University","Ethics","Travel & Culture","Relationships","Health","Abstract","Entertainment","Practical"]}
        ],
        'D': [
            {title:"1-10: INTERVIEW", items:["Self Intro","Strengths","Why Hire?","Salary","5-Year Plan","Failure","Leadership","Resume Gap","Questions","Negotiation"]},
            {title:"11-20: MEETINGS", items:["Agenda","Opening","Brainstorming","Taking Minutes","Status Updates","Problem Solving","Opinions","Agreeing","Closing","Zoom Etiquette"]},
            {title:"21-100: MORE", items:["Communication","Office","Leadership Skills","Business Concepts","Clients","HR","Tech in Biz","Global Biz"]}
        ]
    };

    let state = { score: parseInt(localStorage.getItem('talk24_score')) || 0, streak: 0, notes: [] };

    window.onload = async () => {
        const res = await fetch(`${SERVER_URL}/api/stats`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: USER_ID}) });
        const data = await res.json();
        updateUI(data.score, data.streak);
    };

    function updateUI(s, streak = 0) {
        state.score = s; localStorage.setItem('talk24_score', s);
        document.getElementById('chat-lvl').innerText = `LVL ${Math.floor(s/1000)+1}`;
        document.getElementById('streak-display').innerText = `🔥 ${streak}`;
        document.getElementById('xp-bar').style.width = `${(s % 1000 / 1000) * 100}%`;
    }

    function loadTopics(m) {
        state.mod = m;
        const container = document.getElementById('topic-container');
        container.innerHTML = "";
        FULL_SYLLABUS[m].forEach(g => {
            const h = document.createElement('div'); h.className="topic-group"; h.innerText=g.title; container.appendChild(h);
            const grid = document.createElement('div'); grid.className="topic-grid";
            g.items.forEach(topic => {
                const b = document.createElement('button'); b.className="topic-btn"; b.innerText=topic;
                b.onclick = () => startMission(topic); grid.appendChild(b);
            });
            container.appendChild(grid);
        });
        document.getElementById('home-screen').classList.remove('active-screen');
        document.getElementById('topic-screen').classList.add('active-screen');
    }

    function startMission(t) {
        state.topic = t;
        document.getElementById('topic-screen').classList.remove('active-screen');
        document.getElementById('chat-screen').classList.add('active-screen');
        callAPI({ message: `Mission Start: ${t}`, systemInstruction: `Skill Level: ${state.mod}`, userId: USER_ID, inputType: 'click' });
    }

    async function sendToAI(text, type = 'click') {
        const d = document.createElement('div'); d.className = 'bubble user-bubble'; d.innerText = text;
        document.getElementById('messages').appendChild(d);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        callAPI({ message: text, systemInstruction: `Skill Level: ${state.mod}`, userId: USER_ID, inputType: type });
    }

    async function callAPI(payload) {
        const mic = document.getElementById('mic-btn'); mic.classList.add('listening');
        const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        mic.classList.remove('listening');
        if(data.score_added > 0) {
            document.getElementById('snd-success').play();
            confetti({ particleCount: 30, origin: { y: 0.8 }, colors: payload.inputType==='voice'?['#ffd700','#00ffcc']:['#00ffcc'] });
            updateUI(data.new_total_score, data.streak);
        }
        renderAiMsg(data.reply, data.performance, data.notes);
    }

    function renderAiMsg(reply, perf, notes) {
        const box = document.getElementById('messages');
        const d = document.createElement('div'); d.className = 'bubble ai-bubble';
        let cleanText = reply; let choices = [];
        const match = reply.match(/\[A\.(.*)\|.*B\.(.*)\]/);
        if(match) { cleanText = reply.split('[')[0]; choices = [match[1].trim(), match[2].trim()]; }
        d.innerHTML = `<div>${cleanText}</div>`;
        if(perf) d.innerHTML += `<div class="assessment-card">📊 ASSESSMENT: ${perf}</div>`;
        if(notes) d.innerHTML += `<div class="mentor-note">${notes.replace(/\\n/g, '<br>')}</div>`;
        if(choices.length > 0) {
            const cBox = document.createElement('div'); cBox.className = 'choice-box';
            choices.forEach(c => {
                const b = document.createElement('button'); b.className='choice-btn'; b.innerText=c;
                b.onclick=()=>sendToAI(c, 'click'); cBox.appendChild(b);
            });
            d.appendChild(cBox);
            const hint = document.createElement('div'); hint.className='xp-hint'; hint.innerText="🔥 SPEAK via Mic to earn 20 XP!"; d.appendChild(hint);
        }
        box.appendChild(d); box.scrollTop = box.scrollHeight;
        state.notes.push(`[${state.topic}] ${perf} | ${notes}`);
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(cleanText));
    }

    function downloadReport() {
        const blob = new Blob([state.notes.join('\n\n')], {type:'text/plain'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Mastery_Report.txt`; a.click();
    }

    const rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = rec ? new rec() : null;
    function toggleMic() { 
        if(!recognition) return alert("Mic not supported."); 
        recognition.start(); 
        recognition.onresult=(e)=>sendToAI(e.results[0][0].transcript, 'voice'); 
    }
</script>
</body>
</html>
