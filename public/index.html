<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Practice English Fearlessly</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --green: #58cc02; --green-shade: #46a302;
            --blue: #1cb0f6; --blue-shade: #1899d6;
            --yellow: #ffc800; --yellow-shade: #e5b400;
            --bg: #ffffff; --font: 'Nunito', sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #3c3c3c; }

        /* SCROLLABLE HOME */
        #home-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }

        .logo { font-family: 'Fredoka', sans-serif; font-size: 38px; color: var(--green); margin-bottom: 5px; letter-spacing: -1px; }
        
        .hero-card { width: 100%; max-width: 400px; background: #fff; border: 2px solid #e5e5e5; border-radius: 25px; padding: 20px; text-align: center; box-shadow: 0 4px 0 #e5e5e5; margin-bottom: 20px; }
        .pain-point-msg { color: #777; margin-bottom: 15px; font-weight: 700; font-size: 14px; line-height: 1.4; }
        .highlight { color: var(--green); font-weight: 900; }

        /* INPUTS & CHIPS */
        .role-group { text-align: left; margin-bottom: 12px; }
        .label-text { font-size: 12px; font-weight: 800; color: #afafaf; text-transform: uppercase; margin-left: 5px; }
        .input-duo { width: 100%; padding: 12px; border: 2px solid #e5e5e5; border-radius: 12px; font-size: 15px; font-weight: 700; color: #4b4b4b; background: #fdfdfd; outline: none; transition: 0.2s; }
        .input-duo:focus { border-color: var(--blue); background: #fff; }

        .chip-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .chip { background: #f0f0f0; border: 1px solid #e5e5e5; color: #666; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .chip:active { background: var(--blue); color: white; }

        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-magic { flex: 1; padding: 15px; background: white; color: var(--yellow-shade); font-size: 24px; font-weight: 800; border: 2px solid #e5e5e5; border-radius: 16px; box-shadow: 0 4px 0 #e5e5e5; cursor: pointer; }
        .btn-main { flex: 4; padding: 15px; background: var(--green); color: white; font-size: 16px; font-weight: 800; border: none; border-radius: 16px; box-shadow: 0 4px 0 var(--green-shade); cursor: pointer; text-transform: uppercase; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        /* CHAT UI */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .top-nav { padding: 10px 20px; border-bottom: 2px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; background: #fff; z-index: 10; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 160px; }
        
        .bubble-container { display: flex; flex-direction: column; max-width: 90%; align-items: flex-start; }
        
        .bubble { padding: 14px 18px; border-radius: 20px; font-size: 16px; line-height: 1.5; font-weight: 600; width: 100%; }
        .ai { background: #f2f2f2; color: #4b4b4b; border-bottom-left-radius: 4px; border: 2px solid #e5e5e5; }
        .user { background: var(--blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 0 var(--blue-shade); margin-bottom: 5px; }
        
        /* MENTOR NOTE STYLE */
        .mentor-note {
            margin-top: 8px; background: #fffde7; color: #6d4c41;
            padding: 10px 15px; border-radius: 15px; font-size: 13px;
            font-weight: 600; border: 1px dashed #fbc02d; width: 100%;
            line-height: 1.6; position: relative;
        }
        .mentor-note strong { color: #e65100; font-size: 14px; }

        .replay-btn { margin-top: 5px; margin-left: 5px; font-size: 11px; color: #aaa; cursor: pointer; font-weight: 700; background: #fff; border: 1px solid #eee; padding: 4px 10px; border-radius: 15px; display: inline-flex; align-items: center; gap: 4px; }
        
        .typing { font-size: 12px; color: #aaa; margin-left: 20px; font-weight: 700; display: none; }
        .bottom-area { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px 20px 25px 20px; border-top: 2px solid #f0f0f0; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 200; }
        .input-row { width: 100%; display: flex; gap: 10px; max-width: 600px; }
        
        #mic-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--green); border: 4px solid #fff; color: white; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(88, 204, 2, 0.4); display: flex; align-items: center; justify-content: center; transition: 0.2s; position: absolute; top: -35px; left: 50%; transform: translateX(-50%); }
        #mic-btn:active { transform: translateX(-50%) scale(0.95); }
        .listening { background: #ff4b4b !important; animation: pulse 1.5s infinite; }
        .processing { background: #ffc800 !important; animation: spin 1s infinite; font-size: 0 !important; }
        .processing::after { content: "⏳"; font-size: 24px; }

        .wa-btn { position: fixed; bottom: 100px; right: 20px; background: #25d366; color: white; padding: 8px 16px; border-radius: 30px; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 13px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); z-index: 500; }
        #install-btn { margin-top: 15px; background: white; color: var(--blue); border: 2px solid var(--blue); padding: 10px 20px; border-radius: 15px; font-weight: 800; font-size: 14px; cursor: pointer; display: none; align-items: center; gap: 8px; }
        
        @keyframes pulse { 0% {transform: translateX(-50%) scale(1);} 50% {transform: translateX(-50%) scale(1.1);} 100% {transform: translateX(-50%) scale(1);} }
        @keyframes spin { 0% {transform: translateX(-50%) rotate(0deg);} 100% {transform: translateX(-50%) rotate(360deg);} }
    </style>
</head>
<body>

<a href="https://wa.me/8801303680618?text=Hello%20Talk24AI..." target="_blank" class="wa-btn">Help</a>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div style="background:#e5f6fd; color:#1cb0f6; padding:6px 15px; border-radius:20px; font-weight:900; font-size:12px; margin-bottom:15px;">⚡ Unlimited Free ⚡</div>
    
    <div class="hero-card">
        <div class="pain-point-msg">Make your own story with <span class="highlight">Talk24AI</span>!</div>

        <div class="role-group">
            <div class="label-text">I want to be a...</div>
            <input type="text" id="user-role" class="input-duo" placeholder="e.g. Student">
            <div class="chip-container">
                <div class="chip" onclick="fillInput('user-role', 'Student')">Student</div>
                <div class="chip" onclick="fillInput('user-role', 'Customer')">Customer</div>
            </div>
        </div>

        <div class="role-group">
            <div class="label-text">Talk24AI acts as a...</div>
            <input type="text" id="ai-role" class="input-duo" placeholder="e.g. Teacher">
            <div class="chip-container">
                <div class="chip" onclick="fillInput('ai-role', 'Teacher')">Teacher</div>
                <div class="chip" onclick="fillInput('ai-role', 'Shopkeeper')">Shopkeeper</div>
            </div>
        </div>

        <div class="role-group">
            <div class="label-text">Mood</div>
            <input type="text" id="chat-mood" class="input-duo" placeholder="e.g. Fun">
            <div class="chip-container">
                <div class="chip" onclick="fillInput('chat-mood', 'Fun 🤣')">Fun 🤣</div>
                <div class="chip" onclick="fillInput('chat-mood', 'Serious 🧐')">Serious 🧐</div>
            </div>
        </div>

        <div class="role-group">
            <div class="label-text">Situation</div>
            <input type="text" id="scene-context" class="input-duo" placeholder="e.g. Asking for help">
            <div class="chip-container">
                <div class="chip" onclick="fillInput('scene-context', 'Bargaining')">Bargaining</div>
                <div class="chip" onclick="fillInput('scene-context', 'Interview')">Interview</div>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-magic" onclick="randomize()">🎲</button>
            <button class="btn-main" onclick="startCustomChat()">START MAGIC ✨</button>
        </div>
        <button id="install-btn" onclick="installApp()">📲 Install App</button>
    </div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <div id="p-icon" style="font-size: 30px;">🎭</div>
            <div>
                <div style="font-weight: 800; font-size: 16px;" id="p-name">AI Mate</div>
                <div style="font-size: 11px; color: #58cc02; font-weight: 800;">● ONLINE</div>
            </div>
        </div>
        <div style="background: #fff4db; color: #d68f00; padding: 5px 12px; border-radius: 20px; font-weight: 800; font-size: 14px;">💎 <span id="score">0</span></div>
    </div>

    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is typing...</div>

    <div class="bottom-area">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
        <div class="input-row">
            <input type="text" id="userInput" class="input-duo" placeholder="Type a message..." onkeypress="handleEnter(event)">
        </div>
    </div>
</div>

<script>
    let state = { userRole: '', aiRole: '', scene: '', mood: 'Normal', score: 0 };
    let isMicOn = false;
    let chatHistory = [];
    let deferredPrompt; 

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-btn').style.display = 'block'; });
    async function installApp() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } }

    function fillInput(id, value) { document.getElementById(id).value = value; }
    function randomize() {
        const sets = [
            { u: 'Buyer', a: 'Shopkeeper', s: 'Bargaining hard', m: 'Fun 🤣' },
            { u: 'Candidate', a: 'Interviewer', s: 'Job Interview', m: 'Serious 🧐' },
            { u: 'Tourist', a: 'Local', s: 'Lost in Dhaka', m: 'Confused 😕' }
        ];
        const r = sets[Math.floor(Math.random() * sets.length)];
        fillInput('user-role', r.u); fillInput('ai-role', r.a); fillInput('scene-context', r.s); fillInput('chat-mood', r.m);
    }

    function startCustomChat() {
        const u = document.getElementById('user-role').value;
        const a = document.getElementById('ai-role').value;
        if(!u || !a) return alert("Select roles!");
        state.userRole = u; state.aiRole = a; 
        state.scene = document.getElementById('scene-context').value || "Chat";
        state.mood = document.getElementById('chat-mood').value || "Normal";
        document.getElementById('p-name').innerText = a;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const sys = `Roleplay: ${state.aiRole} & ${state.userRole}. Scene: ${state.scene}. Mood: ${state.mood}. Start conversation.`;
        callAPI({ message: "Action!", systemInstruction: sys, mood: state.mood });
    }

    async function sendToAI(text) {
        if(!text.trim()) return;
        addUserMsg(text);
        chatHistory.push(`User: ${text}`);
        document.getElementById('userInput').value = '';
        toggleTyping(true);
        
        const sys = `Identity: ${state.aiRole}. User: ${state.userRole}. Context: ${state.scene}. Rules: Simple English. Short sentences.`;
        callAPI({ message: text, systemInstruction: sys, mood: state.mood });
    }

    async function callAPI(payload) {
        try {
            document.getElementById('mic-btn').classList.add('processing');
            const res = await fetch('/api/chat', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) 
            });
            const data = await res.json();
            document.getElementById('mic-btn').classList.remove('processing');
            toggleTyping(false);
            
            chatHistory.push(`AI: ${data.reply}`);
            addAiMsg(data.reply, data.instruction);
        } catch (e) { 
            document.getElementById('mic-btn').classList.remove('processing');
            toggleTyping(false);
        }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    function addAiMsg(text, instruction) {
        const container = document.createElement('div'); container.className = 'bubble-container';
        
        // 1. English Bubble
        const bubble = document.createElement('div'); bubble.className = 'bubble ai'; bubble.innerText = text;
        
        // Replay Button
        const replayBtn = document.createElement('div'); replayBtn.className = 'replay-btn';
        replayBtn.innerHTML = '🔊 Replay'; replayBtn.onclick = () => speak(text);

        container.appendChild(bubble);
        container.appendChild(replayBtn);

        // 2. Mentor Note (UI Update: "Talk24AI Mentor")
        if (instruction) {
            const note = document.createElement('div');
            note.className = 'mentor-note';
            note.innerHTML = `<strong>Talk24AI Mentor:</strong><br>${instruction}`;
            container.appendChild(note);
        }

        document.getElementById('messages').appendChild(container);
        speak(text); 
        scrollToBottom();
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        div.style.alignSelf = 'flex-end';
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0; window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = (SpeechRecognition) ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'en-US';
        recognition.onstart = () => document.getElementById('mic-btn').classList.add('listening');
        recognition.onend = () => document.getElementById('mic-btn').classList.remove('listening');
        recognition.onresult = (e) => { const txt = e.results[0][0].transcript; document.getElementById('userInput').value = txt; sendToAI(txt); };
    }
    
    function toggleMic() { if(!recognition) return alert("Mic error"); isMicOn ? recognition.stop() : recognition.start(); isMicOn = !isMicOn; }
</script>
</body>
</html>
