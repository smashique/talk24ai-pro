<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Video Mastery</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- 🎨 THEME: DARK CYBER ISLAMIC --- */
        :root { 
            --bg-color: #002b20;   
            --card-bg: #001e17;    
            --input-bg: #00382e;   
            --text-white: #ffffff;
            --text-gray: #aabeb8;
            --accent-cyan: #00ffcc; 
            --btn-grad: linear-gradient(90deg, #ff8c00, #ff2e63); 
            --font: 'Nunito', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); margin: 0; background: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text-white); user-select: none; }

        /* --- 🌀 BACKGROUND ANIMATION --- */
        .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; z-index: -1; animation: float 30s infinite linear; filter: blur(80px); }
        .shape1 { width: 300px; height: 300px; background: #00ffcc; top: -10%; left: -10%; }
        .shape2 { width: 250px; height: 250px; background: #ff8c00; bottom: -10%; right: -10%; }
        @keyframes float { 0% { transform: translate(0, 0); } 50% { transform: translate(20px, 40px); } 100% { transform: translate(0, 0); } }

        /* --- 🏠 HOME SCREEN --- */
        #home-screen { position: fixed; inset: 0; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; background: var(--bg-color); }
        .logo { font-family: 'Fredoka', sans-serif; font-size: 36px; color: var(--text-white); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }

        .hero-card { width: 100%; max-width: 420px; background: var(--card-bg); border: 2px solid #004d40; border-radius: 25px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 15px; }
        .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .skill-option { background: var(--input-bg); border: 1px solid transparent; border-radius: 12px; padding: 15px 10px; cursor: pointer; text-align: center; }
        .skill-option.selected { border-color: var(--accent-cyan); background: rgba(0, 255, 204, 0.1); }
        .skill-option:last-child { grid-column: span 2; }
        
        .btn-start { width: 100%; padding: 16px; background: var(--btn-grad); color: white; font-size: 16px; font-weight: 900; border: none; border-radius: 15px; cursor: pointer; text-transform: uppercase; }

        /* --- 📹 VIDEO CHAT INTERFACE --- */
        #video-screen { display: none; position: fixed; inset: 0; background: #000; flex-direction: column; z-index: 6000; }
        
        /* 🧑‍🏫 AI TEACHER VIEW */
        #ai-viewport { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #ai-avatar { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: transform 0.3s; }
        .avatar-pulse { animation: talk-pulse 0.5s infinite alternate; }
        @keyframes talk-pulse { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.02); filter: brightness(1.2); } }

        /* 🤳 USER PREVIEW (PICTURE-IN-PICTURE) */
        #user-preview { position: absolute; top: 20px; right: 20px; width: 120px; height: 160px; border-radius: 15px; border: 2px solid var(--accent-cyan); background: #222; object-fit: cover; z-index: 6010; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* 💬 CAPTIONS & FEEDBACK overlay */
        .video-overlay { position: absolute; bottom: 100px; left: 0; width: 100%; padding: 20px; pointer-events: none; }
        .subtitle-box { background: rgba(0,0,0,0.7); color: #fff; padding: 12px 20px; border-radius: 15px; font-size: 18px; text-align: center; max-width: 80%; margin: 0 auto; border-left: 4px solid var(--accent-cyan); }
        .mentor-popup { margin-top: 10px; background: rgba(0, 43, 32, 0.8); color: var(--accent-cyan); padding: 10px; border-radius: 10px; font-size: 13px; max-width: 70%; margin-left: auto; margin-right: auto; backdrop-filter: blur(5px); }

        /* 🎙️ VIDEO CONTROLS */
        .video-controls { position: absolute; bottom: 0; width: 100%; height: 90px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; align-items: center; justify-content: center; gap: 20px; padding-bottom: 10px; }
        .mic-trigger { width: 65px; height: 65px; border-radius: 50%; background: var(--input-bg); border: 2px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .mic-trigger.active { background: #ff2e63; border-color: #ff2e63; color: white; transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 46, 99, 0.5); }
        
        /* MODALS */
        #curriculum-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 7000; align-items: center; justify-content: center; padding: 20px; }
        .curriculum-card { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 2px solid var(--accent-cyan); width: 100%; max-width: 450px; }
    </style>
</head>
<body>

<audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div class="hero-card">
        <div class="section-label" style="font-size: 10px; color: var(--text-gray); margin-bottom: 5px;">SELECT YOUR TRACK</div>
        <div class="skill-grid">
            <div class="skill-option" onclick="selectSkill('A', this)"><b>Beginner</b><br><small>6-10 yrs</small></div>
            <div class="skill-option" onclick="selectSkill('B', this)"><b>Learner</b><br><small>10-16 yrs</small></div>
            <div class="skill-option" onclick="selectSkill('C', this)"><b>Hesitant</b><br><small>17-24 yrs</small></div>
            <div class="skill-option" onclick="selectSkill('D', this)"><b>IELTS</b><br><small>Academic</small></div>
            <div class="skill-option" onclick="selectSkill('E', this)"><b>Professional</b><br><small>24-34 yrs</small></div>
        </div>
        <button class="btn-start" onclick="startVideoSession()">📹 START VIDEO CHAT</button>
    </div>
</div>

<div id="video-screen">
    <div id="ai-viewport">
        <img id="ai-avatar" src="https://img.freepik.com/free-photo/friendly-smiling-woman-pointing-up_23-2148336214.jpg" alt="AI Teacher">
        
        <video id="user-preview" autoplay muted playsinline></video>

        <div class="video-overlay">
            <div id="ai-subtitles" class="subtitle-box">Connecting to your Magic Teacher...</div>
            <div id="mentor-feedback" class="mentor-popup" style="display: none;"></div>
        </div>
    </div>

    <div class="video-controls">
        <button id="mic-btn" class="mic-trigger" onclick="toggleVoice()">🎙️</button>
        <button class="mic-trigger" style="background: #444; border-color: #fff;" onclick="location.reload()">❌</button>
    </div>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com"; 
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);

    let state = { skill: null, isTalking: false };

    // TRACK ASSETS (Role-play Matching)
    const TRACK_THEMES = {
        'A': { img: "https://img.freepik.com/free-vector/hand-drawn-english-teacher-illustration_23-2149503463.jpg", label: "Magic Teacher" },
        'B': { img: "https://img.freepik.com/free-photo/young-female-teacher-classroom_23-2148668614.jpg", label: "Dynamic Coach" },
        'C': { img: "https://img.freepik.com/free-photo/happy-young-man-sitting-library_23-2148542617.jpg", label: "Conversation Partner" },
        'D': { img: "https://img.freepik.com/free-photo/man-with-glasses-working-office_23-2148821703.jpg", label: "IELTS Examiner" },
        'E': { img: "https://img.freepik.com/free-photo/businesswoman-working-office_23-2148811445.jpg", label: "Executive Mentor" }
    };

    function selectSkill(code, el) {
        document.querySelectorAll('.skill-option').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
        state.skill = code;
    }

    async function startVideoSession() {
        if (!state.skill) return alert("Please select a Track first!");
        
        // 1. Set Avatar
        document.getElementById('ai-avatar').src = TRACK_THEMES[state.skill].img;
        
        // 2. Request Camera
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('user-preview').srcObject = stream;
        } catch (e) { alert("Camera access is needed for Video Chat experience!"); }

        // 3. Switch UI
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('video-screen').style.display = 'flex';

        // 4. Initial AI Call
        callAcademyAPI("Action!");
    }

    async function callAcademyAPI(text) {
        const subBox = document.getElementById('ai-subtitles');
        const feedbackBox = document.getElementById('mentor-feedback');
        
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ message: text, systemInstruction: `Skill Level: ${state.skill}`, userId: USER_ID })
            });
            const data = await res.json();

            // AI TALKING ANIMATION
            subBox.innerText = data.reply;
            if(data.instruction) {
                feedbackBox.style.display = 'block';
                feedbackBox.innerText = data.instruction.replace(/\\n/g, ' | ');
            }

            // Text-to-Speech with Avatar Pulse
            const utter = new SpeechSynthesisUtterance(data.reply);
            utter.onstart = () => document.getElementById('ai-avatar').classList.add('avatar-pulse');
            utter.onend = () => document.getElementById('ai-avatar').classList.remove('avatar-pulse');
            window.speechSynthesis.speak(utter);

        } catch (e) { subBox.innerText = "Connection lost. Please try again."; }
    }

    // VOICE RECOGNITION
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = SpeechRecognition ? new SpeechRecognition() : null;

    function toggleVoice() {
        if (!rec) return alert("Voice recognition not supported in this browser.");
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        document.getElementById('ai-subtitles').innerText = "Listening...";
        
        rec.start();
        rec.onresult = (e) => {
            const result = e.results[0][0].transcript;
            document.getElementById('ai-subtitles').innerText = "You said: " + result;
            btn.classList.remove('active');
            callAcademyAPI(result);
        };
        rec.onerror = () => btn.classList.remove('active');
    }
</script>
</body>
</html>
