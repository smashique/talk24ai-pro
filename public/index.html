<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Pure Spoken Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #002b20; --card: #001e17; --cyan: #00ffcc; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header Buttons */
        .app-header { background: var(--card); padding: 10px 15px; border-bottom: 2px solid #004d40; display: flex; justify-content: space-between; align-items: center; }
        .nav-actions { display: flex; gap: 10px; }
        .action-btn { background: var(--cyan); color: black; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 11px; cursor: pointer; transition: 0.3s; }
        
        /* Highlight Animation */
        @keyframes glow { 0% { box-shadow: 0 0 5px var(--cyan); transform: scale(1); } 50% { box-shadow: 0 0 20px var(--cyan); transform: scale(1.1); } 100% { box-shadow: 0 0 5px var(--cyan); transform: scale(1); } }
        .highlight-btn { animation: glow 0.8s ease-in-out 3; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; }
        .bubble { padding: 15px; border-radius: 18px; font-size: 16px; max-width: 85%; line-height: 1.6; }
        .ai-bubble { background: #00382e; border: 1px solid #004d40; align-self: flex-start; }
        .user-bubble { background: #005f6b; align-self: flex-end; }
        .highlight { color: var(--gold); font-weight: 900; background: rgba(255, 215, 0, 0.1); }

        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 25px; display: flex; justify-content: center; background: linear-gradient(transparent, var(--bg)); }
        #mic-btn { width: 70px; height: 70px; border-radius: 50%; background: #00382e; border: 4px solid var(--cyan); color: var(--cyan); font-size: 28px; cursor: pointer; }
        #mic-btn.active { border-color: #ff4500; color: #ff4500; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<header class="app-header">
    <div>
        <div style="color:var(--cyan); font-size:18px; font-weight:900;">Talk24AI</div>
        <select id="mode-selector" onchange="changeMode(this.value)" style="background:none; color:var(--cyan); border:none; font-size:12px; font-weight:700;">
            <option value="Junior">Junior Mode</option>
            <option value="Senior">Senior Mode</option>
            <option value="Pro">Pro Mode</option>
        </select>
    </div>
    <div class="nav-actions">
        <button id="btn-download-app" class="action-btn">DOWNLOAD APP</button>
        <button class="action-btn" style="background:var(--gold);" onclick="downloadNotes()">DOWNLOAD NOTES</button>
    </div>
</header>

<div id="messages"></div>
<div class="bottom-area"><button id="mic-btn" onclick="toggleMic()">🎙️</button></div>

<script>
    const SERVER_URL = window.location.origin;
    let UID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', UID);
    let currentMode = localStorage.getItem('talk24_mode') || 'Senior';
    let chatHistory = [];

    // Halal Sound Generator (Pure Sine Wave Chime)
    function playHalalSound() {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, context.currentTime); // C5 note
        osc.frequency.exponentialRampToValueAtTime(1046.50, context.currentTime + 0.1); // Slide to C6
        gain.gain.setValueAtTime(0.1, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(context.destination);
        osc.start();
        osc.stop(context.currentTime + 0.5);
    }

    async function callAPI(payload) {
        payload.mode = currentMode;
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            const data = await res.json();
            
            if(payload.inputType === 'voice') {
                playHalalSound();
                const appBtn = document.getElementById('btn-download-app');
                appBtn.classList.add('highlight-btn');
                setTimeout(() => appBtn.classList.remove('highlight-btn'), 3000);
            }
            
            renderMsg(data.reply, 'ai');
            chatHistory.push({ role: 'AI', text: data.reply, time: new Date().toLocaleString() });
        } catch(e) { renderMsg("Ready to continue? 1. Yes. 2. Of course!", 'ai'); }
    }

    function renderMsg(txt, sender) {
        const box = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `bubble ${sender}-bubble`;
        
        const words = txt.split(' ');
        d.innerHTML = `<div id="speech-box">` + words.map(w => `<span>${w} </span>`).join('') + `</div>`;
        
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        if(sender === 'ai') speak(txt, d.querySelector('#speech-box'));
        if(sender === 'user') chatHistory.push({ role: 'You', text: txt, time: new Date().toLocaleString() });
    }

    function downloadNotes() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("Talk24AI - English Practice Notes", 10, 20);
        doc.setFontSize(10);
        let y = 30;
        
        chatHistory.forEach(item => {
            if (y > 270) { doc.addPage(); y = 20; }
            doc.setFont("helvetica", "bold");
            doc.text(`${item.role} [${item.time}]:`, 10, y);
            doc.setFont("helvetica", "normal");
            const splitText = doc.splitTextToSize(item.text, 180);
            doc.text(splitText, 10, y + 5);
            y += (splitText.length * 5) + 10;
        });
        doc.save(`English_Notes_${new Date().toLocaleDateString()}.pdf`);
    }

    function speak(text, element) {
        const ut = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        ut.voice = voices.find(v => v.name.includes('Male')) || voices[0];
        ut.rate = currentMode === 'Junior' ? 0.8 : 1.0;
        
        const spans = element.querySelectorAll('span');
        let wordIndex = 0;
        ut.onboundary = (e) => {
            if (e.name === 'word' && wordIndex < spans.length) {
                spans.forEach(s => s.classList.remove('highlight'));
                spans[wordIndex].classList.add('highlight');
                wordIndex++;
            }
        };
        window.speechSynthesis.speak(ut);
    }

    const rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = rec ? new rec() : null;
    function toggleMic() {
        if(!recognition) return;
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        recognition.start();
        recognition.onresult = (e) => {
            btn.classList.remove('active');
            const t = e.results[0][0].transcript;
            renderMsg(t, 'user');
            callAPI({ message: t, userId: UID, inputType: 'voice' });
        };
        recognition.onerror = () => btn.classList.remove('active');
    }
    
    // Initial Trigger
    window.onload = () => { if(currentMode) callAPI({ message: "Hello", userId: UID, inputType: 'click' }); };
</script>
</body>
</html>
