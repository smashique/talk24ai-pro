<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Your AI Spoken Mate</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #58cc02; --primary-dark: #46a302; --blue: #1cb0f6; --bg: #ffffff; --font: 'Nunito', sans-serif; }
        body { font-family: var(--font); margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #333; }

        /* Home & Scenario Screens */
        #home-screen, #scenario-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        #scenario-screen { display: none; overflow-y: auto; justify-content: start; }

        .logo { font-family: 'Fredoka', sans-serif; font-size: 48px; color: var(--primary); margin-bottom: 5px; }
        .tagline-box { background: #fff9c4; color: #f57f17; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; margin-bottom: 30px; border: 1px dashed #fbc02d; line-height: 1.4; max-width: 350px; }
        
        .btn-main { width: 100%; max-width: 320px; padding: 18px; background: var(--primary); border: none; border-bottom: 5px solid var(--primary-dark); color: white; font-size: 18px; font-weight: 900; border-radius: 20px; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        .sc-grid { width: 100%; max-width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .role-card { border: 2px solid #f0f0f0; border-bottom: 5px solid #f0f0f0; border-radius: 20px; padding: 20px; cursor: pointer; text-align: center; background: white; transition: 0.2s; }
        .role-card:active { transform: translateY(4px); border-bottom-width: 0; border-color: var(--blue); }

        /* Chat Layout */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .top-nav { padding: 12px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; background: #fff; z-index: 100; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #fff; scroll-behavior: smooth; }
        
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 22px; font-size: 16px; line-height: 1.5; font-weight: 600; animation: msgSlide 0.3s ease-out; }
        .ai { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e5e5e5; }
        .user { background: var(--blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; border-bottom: 4px solid #1899d6; }
        
        .typing { font-size: 12px; color: #afafaf; font-weight: 800; margin: 0 0 10px 25px; display: none; }
        .input-bar { padding: 15px 20px 30px 20px; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center; background: white; }
        #userInput { flex: 1; background: #f7f7f7; border: 1px solid #eee; padding: 15px 20px; border-radius: 30px; outline: none; font-size: 16px; font-weight: 600; font-family: inherit; }
        #mic-btn { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(88, 204, 2, 0.3); }
        .listening { background: #ff4b4b !important; animation: pulse 1s infinite; }

        #toast-warning { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #ff4b4b; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; z-index: 6000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        @keyframes msgSlide { from {opacity: 0; transform: translateY(15px);} to {opacity: 1; transform: translateY(0);} }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"></audio>
<div id="toast-warning">🚫 Please try to speak in English!</div>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div class="tagline-box">
        No Partner to Practice? <br>
        Meet Talk24AI: Your 24/7 Spoken English Mate.
    </div>
    <div style="width: 100%; max-width: 320px; display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="number" id="age" value="18" style="width:50%; padding:15px; border-radius:15px; border:2px solid #ddd; text-align:center; font-weight:900;">
        <select id="gender" style="width:50%; padding:15px; border-radius:15px; border:2px solid #ddd; font-weight:900;">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
    </div>
    <button class="btn-main" onclick="showScenarios()">Find My Mate</button>
</div>

<div id="scenario-screen">
    <div style="padding: 25px; text-align: center; border-bottom: 1px solid #eee;">
        <div style="font-size: 22px; font-weight: 900;">Select Your Roleplay</div>
    </div>
    <div class="sc-grid" id="role-grid"></div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div style="display:flex; align-items:center; gap:12px;">
            <div id="p-icon" style="font-size: 30px;">🤖</div>
            <div style="font-weight: 900; font-size: 18px;" id="p-name">AI Mate</div>
        </div>
        <div style="background: #fff4db; color: #d68f00; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px;">⭐ <span id="score">0</span></div>
    </div>
    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is thinking...</div>
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type or use Mic..." onkeypress="handleEnter(event)">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>
</div>

<script>
    const scenarios = {
        junior: [
            { name: "Islamic Storyteller", icon: "🕌", prompt: "Tell simple inspiring stories of Islamic Heroes. Keep sentences short. Always end with a simple question." },
            { name: "English Teacher", icon: "👩‍🏫", prompt: "Be a kind teacher. Ask about school. Correct gently in brackets." },
            { name: "Best Friend", icon: "🏸", prompt: "Talk about cricket or toys. Be very friendly." }
        ],
        senior: [
            { name: "History Explorer", icon: "📜", prompt: "Discuss Islamic Golden Age inventions or History of Mecca. Be intellectual." },
            { name: "Job Interviewer", icon: "💼", prompt: "Start the interview immediately. Ask: 'Tell me about yourself'. No preamble." },
            { name: "IELTS Examiner", icon: "🇬🇧", prompt: "Conduct a formal IELTS Speaking test Part 1. Focus on fluency." },
            { name: "Foreign Friend", icon: "🌏", prompt: "You are a traveler in Dhaka. Ask about local culture and food." }
        ]
    };

    let state = { age: 18, gender: 'Male', currentRole: null, score: 0 };
    let isMicOn = false;
    let chatHistory = []; // মেমোরি লাইব্রেরি হিসেবে কাজ করবে

    function showScenarios() {
        state.age = parseInt(document.getElementById('age').value);
        const list = (state.age < 13) ? scenarios.junior : scenarios.senior;
        const grid = document.getElementById('role-grid');
        grid.innerHTML = ''; 
        list.forEach(role => {
            const div = document.createElement('div');
            div.className = 'role-card';
            div.innerHTML = `<div style="font-size:45px; margin-bottom:10px;">${role.icon}</div><div style="font-weight:900; font-size:15px;">${role.name}</div>`;
            div.onclick = () => startChat(role);
            grid.appendChild(div);
        });
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('scenario-screen').style.display = 'flex';
    }

    function startChat(role) {
        state.currentRole = role;
        document.getElementById('p-icon').innerText = role.icon;
        document.getElementById('p-name').innerText = role.name;
        document.getElementById('scenario-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const sysPrompt = `IDENTITY: ${state.currentRole.name}. CONTEXT: ${state.currentRole.prompt}. RULE: START ROLEPLAY IMMEDIATELY. NO PREAMBLE. ENGLISH ONLY. NO BANGLA.`;
        callAPI({ message: "START_ROLEPLAY", systemInstruction: sysPrompt });
    }

    // --- ইমোশন ডিটেক্টর লাইব্রেরি (Simulated) ---
    function detectSentiment(text) {
        const sadKeywords = ['sad', 'bad', 'sick', 'tired', 'unhappy', 'lonely', 'depressed', 'অসুস্থ', 'খারাপ'];
        const happyKeywords = ['happy', 'great', 'awesome', 'good', 'excited', 'ভালো'];
        const lowerText = text.toLowerCase();
        
        if (sadKeywords.some(word => lowerText.includes(word))) return "SAD";
        if (happyKeywords.some(word => lowerText.includes(word))) return "HAPPY";
        return "NEUTRAL";
    }

    async function sendToAI(text) {
        if(!text.trim()) return;

        if(/[\u0980-\u09FF]/.test(text)) {
            const toast = document.getElementById('toast-warning');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        addUserMsg(text);
        const sentiment = detectSentiment(text); // ইমোশন বুঝে নেওয়া
        
        // মেমোরিতে যোগ করা
        chatHistory.push(`User: ${text}`);
        if(chatHistory.length > 6) chatHistory.shift();

        document.getElementById('userInput').value = '';
        toggleTyping(true);

        const expertPrompt = `
            ACT AS: ${state.currentRole.name}. 
            ROLE CONTEXT: ${state.currentRole.prompt}
            [HUMAN-LIKE INTELLIGENCE]
            1. EMOTION: User feeling is ${sentiment}. Respond with empathy like a real mate. 
            2. MEMORY: Keep track of history: ${chatHistory.join(' | ')}.
            3. BANGLADESHI MATE: Be a warm Bangladeshi friend. No Islamic/Iman conflicts.
            4. CORRECTION: Only major errors, use brackets e.g. (Correct: I went). 
            5. THE HOOK: Always end with a short, relevant question.
            6. NO LECTURES: Chat like a peer, not a professor.
            7. ENGLISH ONLY.
        `;

        callAPI({ message: text, systemInstruction: expertPrompt });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch('/api/chat', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            const data = await res.json();
            toggleTyping(false);
            
            let reply = data.reply.trim(); 
            if(reply.length < 5) reply = "That's interesting! Tell me more about it?"; 

            // মেমোরিতে এআই রিপ্লাই যোগ করা
            chatHistory.push(`AI: ${reply}`);
            
            addAiMsg(reply);
        } catch (e) { toggleTyping(false); addAiMsg("Oh! I missed that. Can you repeat please?"); }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    // --- টাইপরাইটার এফেক্ট লাইব্রেরি (Streaming Feel) ---
    function typeWriter(text, element, callback) {
        let i = 0;
        const words = text.split(' ');
        element.innerText = '';
        
        function type() {
            if (i < words.length) {
                element.innerText += words[i] + ' ';
                i++;
                setTimeout(type, 50); // টাইপিং স্পিড
                scrollToBottom();
            } else if (callback) {
                callback();
            }
        }
        type();
    }

    function addAiMsg(text) {
        const div = document.createElement('div'); 
        div.className = 'bubble ai'; 
        document.getElementById('messages').appendChild(div);
        
        // টাইপরাইটার এফেক্ট দিয়ে মেসেজ দেখানো
        typeWriter(text, div, () => {
            speak(text);
        });
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
        document.getElementById('snd-pop').play().catch(e=>{});
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = (SpeechRecognition) ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'en-US';
        recognition.onstart = () => { isMicOn = true; document.getElementById('mic-btn').classList.add('listening'); };
        recognition.onend = () => { isMicOn = false; document.getElementById('mic-btn').classList.remove('listening'); };
        recognition.onresult = (e) => { 
            const txt = e.results[0][0].transcript;
            document.getElementById('userInput').value = txt;
            sendToAI(txt);
        };
    }
    
    function toggleMic() {
        if(!recognition) return alert("Mic not supported.");
        if(!isMicOn) recognition.start();
        else recognition.stop();
    }
</script>
</body>
</html>
