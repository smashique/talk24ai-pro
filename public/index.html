<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Your AI Spoken Mate</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- MODERN UI THEME --- */
        :root {
            --primary: #58cc02; --primary-dark: #46a302;
            --blue: #1cb0f6; --bg: #ffffff;
            --font-main: 'Nunito', sans-serif;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { font-family: var(--font-main); margin: 0; background: var(--bg); color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- HOME SCREEN --- */
        #home-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .logo { font-family: 'Fredoka', sans-serif; font-size: 48px; color: var(--primary); margin-bottom: 10px; }
        .tagline-box { background: #fff9c4; color: #f57f17; padding: 15px 25px; border-radius: 15px; font-weight: 800; font-size: 15px; border: 1px dashed #fbc02d; margin-bottom: 35px; line-height: 1.4; max-width: 350px; }
        .input-card { background: #f7f7f7; padding: 25px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-start { width: 100%; padding: 16px; background: var(--primary); border: none; border-bottom: 5px solid var(--primary-dark); color: white; font-size: 18px; font-weight: 900; border-radius: 18px; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: 0.1s; }
        .btn-start:active { transform: translateY(4px); border-bottom-width: 0; }

        /* --- SCENARIO SELECTION --- */
        #scenario-screen { display: none; position: fixed; inset: 0; background: white; z-index: 4000; overflow-y: auto; flex-direction: column; }
        .sc-header { padding: 30px 20px; text-align: center; background: white; border-bottom: 1px solid #eee; }
        .sc-grid { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 600px; margin: 0 auto; }
        .role-card { background: white; border: 2px solid #f0f0f0; border-bottom: 5px solid #f0f0f0; border-radius: 20px; padding: 20px; cursor: pointer; transition: 0.2s; text-align: center; }
        .role-card:active { transform: translateY(4px); border-bottom-width: 2px; border-color: var(--blue); }

        /* --- CHAT INTERFACE --- */
        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; }
        .nav-bar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; background: var(--glass); backdrop-filter: blur(10px); z-index: 100; }
        .score-pill { background: #fff4db; color: #d68f00; padding: 6px 15px; border-radius: 25px; font-weight: 800; font-size: 14px; border: 1px solid #ffe0b2; }

        #messages { flex: 1; overflow-y: auto; padding: 25px 20px; display: flex; flex-direction: column; gap: 20px; background: #fff; scroll-behavior: smooth; }
        .bubble { max-width: 80%; padding: 14px 20px; border-radius: 22px; font-size: 16px; font-weight: 600; line-height: 1.5; animation: fadeInUp 0.3s ease-out; position: relative; }
        .ai { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e5e5e5; }
        .user { background: var(--blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; border-bottom: 4px solid #1899d6; }

        .typing { font-size: 12px; color: #afafaf; font-weight: 800; margin: 0 25px 10px; display: none; }

        .input-bar { padding: 15px 20px 30px 20px; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center; background: white; }
        #userInput { flex: 1; background: #f7f7f7; border: 1px solid #eee; padding: 15px 20px; border-radius: 30px; outline: none; font-size: 16px; font-weight: 600; font-family: inherit; }
        #mic-btn { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(88, 204, 2, 0.3); }
        .listening { background: #ff4b4b !important; animation: pulse 1s infinite; box-shadow: 0 4px 20px rgba(255, 75, 75, 0.4) !important; }

        @keyframes fadeInUp { from {opacity: 0; transform: translateY(15px);} to {opacity: 1; transform: translateY(0);} }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"></audio>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div class="tagline-box">
        No Partner to Practice? <br>
        Meet Talk24AI: Your 24/7 Spoken English Mate.
    </div>
    <div class="input-card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="number" id="age" value="18" style="width:50%; padding:15px; border-radius:15px; border:2px solid #ddd; text-align:center; font-weight:900;">
            <select id="gender" style="width:50%; padding:15px; border-radius:15px; border:2px solid #ddd; font-weight:900;">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <button class="btn-start" onclick="showScenarios()">Get Started</button>
    </div>
</div>

<div id="scenario-screen">
    <div class="sc-header">
        <div style="font-size: 24px; font-weight: 900; color: #333;">Choose a Mate</div>
        <div style="font-size: 14px; color: #999; font-weight: 700; margin-top: 5px;">Who would you like to speak with?</div>
    </div>
    <div class="sc-grid" id="role-grid"></div>
</div>

<div id="chat-screen">
    <div class="nav-bar">
        <div style="display:flex; align-items:center; gap:12px;">
            <div id="p-icon" style="font-size: 30px;">🤖</div>
            <div style="font-weight: 900; font-size: 18px;" id="p-name">Mate</div>
        </div>
        <div class="score-pill">⭐ <span id="score">0</span></div>
    </div>

    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is listening...</div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Say something in English..." onkeypress="handleEnter(event)">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>
</div>

<script>
    // --- APP DATA ---
    const scenarios = {
        junior: [
            { name: "Islamic Storyteller", icon: "🕌", prompt: "Tell simple inspiring stories of Islamic Heroes. Use easy words. End with a simple question." },
            { name: "English Teacher", icon: "👩‍🏫", prompt: "Be a kind teacher. Ask about school. Correct gently in brackets." },
            { name: "Best Friend", icon: "🏸", prompt: "Talk about cricket/toys. Be very friendly." }
        ],
        senior: [
            { name: "History Explorer", icon: "📜", prompt: "Discuss Islamic Golden Age inventions. Be intellectual and polite." },
            { name: "Job Interviewer", icon: "💼", prompt: "Start the interview now. Ask: 'Tell me about yourself'. No preamble." },
            { name: "IELTS Examiner", icon: "🇬🇧", prompt: "Formal IELTS Speaking test Part 1. Focus on fluency." },
            { name: "Foreign Friend", icon: "🌏", prompt: "Traveler in Dhaka. Ask about local culture/food." }
        ]
    };

    let state = { age: 18, gender: 'Male', currentRole: null, score: 0 };
    let isMicOn = false;

    // --- LOGIC ---
    function showScenarios() {
        state.age = document.getElementById('age').value;
        const list = (state.age < 13) ? scenarios.junior : scenarios.senior;
        const grid = document.getElementById('role-grid');
        grid.innerHTML = ''; 
        list.forEach(role => {
            const div = document.createElement('div');
            div.className = 'role-card';
            div.innerHTML = `<div style="font-size:45px; margin-bottom:10px;">${role.icon}</div><div style="font-weight:900; font-size:15px;">${role.name}</div>`;
            div.onclick = () => startChat(role);
            grid.appendChild(div);
        });
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('scenario-screen').style.display = 'flex';
    }

    function startChat(role) {
        state.currentRole = role;
        document.getElementById('p-icon').innerText = role.icon;
        document.getElementById('p-name').innerText = role.name;
        document.getElementById('scenario-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const prompt = `IDENTITY: ${state.currentRole.name}. CONTEXT: ${state.currentRole.prompt}. RULE: START ROLEPLAY IMMEDIATELY. NO PREAMBLE. ENGLISH ONLY.`;
        callAPI({ message: "START_ROLEPLAY", systemInstruction: prompt });
    }

    async function sendToAI(text) {
        if(!text.trim()) return;
        addUserMsg(text);
        document.getElementById('userInput').value = '';
        toggleTyping(true);

        const expertPrompt = `
            ACT AS: ${state.currentRole.name}.
            STRICT RULES:
            1. BANGLADESHI CONTEXT: Bangladeshi AI mate. Respectful. No Islamic/Iman conflicts.
            2. NO PREAMBLE: Start directly.
            3. NO LECTURES: Do not explain grammar.
            4. CORRECTION: Only if major error, put in brackets e.g. (Correct: I went).
            5. ENGAGEMENT: Always end with a specific question.
            6. NO TRUNCATION: Complete every sentence.
        `;

        callAPI({ message: text, systemInstruction: expertPrompt });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            toggleTyping(false);
            
            let reply = data.reply.replace(/[\u0980-\u09FF].*/g, '').trim(); 
            // Fallback for blank bubbles
            if(reply.length < 5) reply = "I understand. Can you tell me more about that?"; 

            addAiMsg(reply);
        } catch (e) { toggleTyping(false); }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    function addAiMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble ai'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom(); speak(text);
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
        document.getElementById('snd-pop').play().catch(e=>{});
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition(); recognition.lang = 'en-US';
    function toggleMic() {
        if(!isMicOn) { recognition.start(); document.getElementById('mic-btn').classList.add('listening'); isMicOn = true; }
        else { recognition.stop(); document.getElementById('mic-btn').classList.remove('listening'); isMicOn = false; }
    }
    recognition.onresult = (e) => { sendToAI(e.results[0][0].transcript); toggleMic(); };
</script>
</body>
</html>
