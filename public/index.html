<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Your AI Spoken Mate</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- DUOLINGO DESIGN SYSTEM --- */
        :root {
            --duo-green: #58cc02; --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6; --duo-blue-shadow: #1899d6;
            --duo-gray: #e5e5e5; --duo-gray-text: #777;
            --duo-white: #ffffff;
            --duo-bg: #fff;
            --font-main: 'Nunito', sans-serif;
            --font-display: 'Fredoka', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-main); margin: 0; background: var(--duo-bg); color: #3c3c3c; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- BUTTONS & INPUTS (The "Juicy" Effect) --- */
        .btn-duo {
            width: 100%; padding: 16px;
            background: var(--duo-green);
            color: white; font-size: 17px; font-weight: 800; letter-spacing: 0.5px;
            border: none; border-radius: 16px;
            box-shadow: 0 4px 0 var(--duo-green-shadow);
            cursor: pointer; text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-duo:active { transform: translateY(4px); box-shadow: none; }

        .input-duo {
            width: 100%; padding: 15px;
            border: 2px solid var(--duo-gray);
            border-radius: 16px;
            font-size: 16px; font-weight: 700; color: #4b4b4b;
            outline: none; background: #f7f7f7;
            transition: 0.2s;
        }
        .input-duo:focus { border-color: var(--duo-blue); background: white; }

        /* --- SCREENS --- */
        #home-screen, #scenario-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        #scenario-screen { display: none; overflow-y: auto; justify-content: start; padding-top: 40px; }

        /* Home Specifics */
        .logo { font-family: var(--font-display); font-size: 42px; color: var(--duo-green); margin-bottom: 5px; letter-spacing: -1px; }
        .trial-badge {
            background: linear-gradient(45deg, #ffc800, #ff9600);
            color: white; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            margin-bottom: 25px; box-shadow: 0 3px 0 #e58900;
        }
        .hero-card {
            background: white; border: 2px solid var(--duo-gray);
            border-radius: 20px; padding: 25px; width: 100%; max-width: 360px;
            text-align: center; box-shadow: 0 4px 0 var(--duo-gray);
        }

        /* Scenario Grid */
        .sc-grid { width: 100%; max-width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; padding-bottom: 80px; }
        .role-card {
            background: white; border: 2px solid var(--duo-gray);
            border-radius: 20px; padding: 20px; cursor: pointer;
            text-align: center; box-shadow: 0 4px 0 var(--duo-gray);
            transition: 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .role-card:active { transform: translateY(4px); box-shadow: none; border-color: var(--duo-blue); }
        .role-icon { font-size: 40px; margin-bottom: 10px; }
        .role-name { font-weight: 800; color: #4b4b4b; font-size: 15px; }

        /* --- CHAT UI --- */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        
        .top-nav {
            padding: 10px 20px; background: white;
            border-bottom: 2px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .mate-info { display: flex; align-items: center; gap: 10px; }
        .mate-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: #3c3c3c; }
        .status-dot { width: 8px; height: 8px; background: var(--duo-green); border-radius: 50%; display: inline-block; margin-left: 5px; }

        .xp-pill {
            display: flex; align-items: center; gap: 5px;
            font-weight: 800; color: #ff9600; font-size: 15px;
        }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; }
        
        .bubble {
            max-width: 80%; padding: 14px 18px; border-radius: 18px;
            font-size: 16px; line-height: 1.5; font-weight: 600;
            position: relative; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ai {
            background: #f7f7f7; color: #4b4b4b;
            border: 2px solid #e5e5e5; border-bottom-left-radius: 4px;
        }
        .user {
            background: var(--duo-blue); color: white;
            align-self: flex-end; border-bottom-right-radius: 4px;
            box-shadow: 0 2px 0 var(--duo-blue-shadow);
        }

        .typing { font-size: 13px; color: #afafaf; font-weight: 700; margin: 0 0 10px 25px; display: none; }

        .input-area {
            padding: 15px; border-top: 2px solid #e5e5e5;
            display: flex; gap: 10px; align-items: center; background: white;
        }
        #mic-btn {
            width: 50px; height: 50px; border-radius: 15px;
            background: var(--duo-green); border: none; color: white;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 var(--duo-green-shadow);
            display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
        }
        #mic-btn:active { transform: translateY(4px); box-shadow: none; }
        .listening { background: #ff4b4b !important; box-shadow: 0 4px 0 #d13030 !important; animation: pulse 1s infinite; }

        /* WhatsApp Button */
        .wa-float {
            position: fixed; bottom: 20px; right: 20px;
            background: #25d366; width: 56px; height: 56px;
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #1da851; z-index: 6000;
            transition: 0.1s; border: 2px solid white;
        }
        .wa-float:active { transform: translateY(4px); box-shadow: none; }

        /* Toast */
        #toast-warning {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ff4b4b; color: white; padding: 12px 20px;
            border-radius: 15px; font-weight: 800; font-size: 14px;
            z-index: 6000; display: none; box-shadow: 0 4px 0 #d13030;
        }

        @keyframes popIn { from {opacity: 0; transform: scale(0.8);} to {opacity: 1; transform: scale(1);} }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"></audio>
<div id="toast-warning">🚫 Please speak in English!</div>

<a href="https://wa.me/8801303680618?text=Hello%20Talk24AI%20Team,%20I%20have%20some%20feedback..." target="_blank" class="wa-float" title="Feedback">

    </svg>
</a>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div class="trial-badge">🔥 Full Free Trial Period 🔥</div>
    
    <div class="hero-card">
        <div style="font-size: 18px; font-weight: 800; color: #4b4b4b; margin-bottom: 20px;">
            Find Your Spoken Mate
        </div>
        
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="number" id="age" value="18" class="input-duo" style="text-align:center;">
            <select id="gender" class="input-duo">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        
        <button class="btn-duo" onclick="showScenarios()">START PRACTICE</button>
    </div>
</div>

<div id="scenario-screen">
    <div style="text-align: center; width: 100%; max-width: 600px;">
        <div style="font-family: 'Fredoka'; font-size: 28px; color: #4b4b4b; margin-bottom: 5px;">Choose a Mate</div>
        <div style="color: #777; font-weight: 700; margin-bottom: 20px;">Select a character to start speaking</div>
    </div>
    <div class="sc-grid" id="role-grid"></div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div class="mate-info">
            <div id="p-icon" style="font-size: 32px;">🤖</div>
            <div>
                <div class="mate-name" id="p-name">AI Mate</div>
                <div style="font-size: 11px; color: #58cc02; font-weight: 800; display:flex; align-items:center;">
                    <span class="status-dot"></span> ONLINE
                </div>
            </div>
        </div>
        <div class="xp-pill">💎 <span id="score">0</span></div>
    </div>

    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is typing...</div>

    <div class="input-area">
        <input type="text" id="userInput" class="input-duo" placeholder="Type a message..." style="border-width: 2px;" onkeypress="handleEnter(event)">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>
</div>

<script>
    // --- APP DATA ---
    const scenarios = {
        junior: [
            { name: "Islamic Storyteller", icon: "🕌", prompt: "Tell simple inspiring stories of Islamic Heroes. Keep sentences short. Always end with a simple question." },
            { name: "English Teacher", icon: "👩‍🏫", prompt: "Be a kind teacher. Ask about school. Correct gently in brackets." },
            { name: "Best Friend", icon: "🏸", prompt: "Talk about cricket or toys. Be very friendly." }
        ],
        senior: [
            { name: "History Explorer", icon: "📜", prompt: "Discuss Islamic Golden Age inventions or History of Mecca. Be intellectual." },
            { name: "Job Interviewer", icon: "💼", prompt: "Start the interview immediately. Ask: 'Tell me about yourself'. No preamble." },
            { name: "IELTS Examiner", icon: "🇬🇧", prompt: "Conduct a formal IELTS Speaking test Part 1. Focus on fluency." },
            { name: "Foreign Friend", icon: "🌏", prompt: "You are a traveler in Dhaka. Ask about local culture and food." }
        ]
    };

    let state = { age: 18, gender: 'Male', currentRole: null, score: 0 };
    let isMicOn = false;
    let chatHistory = []; // Brilliant Memory

    function showScenarios() {
        state.age = parseInt(document.getElementById('age').value);
        const list = (state.age < 13) ? scenarios.junior : scenarios.senior;
        const grid = document.getElementById('role-grid');
        grid.innerHTML = ''; 
        list.forEach(role => {
            const div = document.createElement('div');
            div.className = 'role-card';
            div.innerHTML = `<div class="role-icon">${role.icon}</div><div class="role-name">${role.name}</div>`;
            div.onclick = () => startChat(role);
            grid.appendChild(div);
        });
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('scenario-screen').style.display = 'flex';
    }

    function startChat(role) {
        state.currentRole = role;
        document.getElementById('p-icon').innerText = role.icon;
        document.getElementById('p-name').innerText = role.name;
        document.getElementById('scenario-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const sysPrompt = `IDENTITY: ${state.currentRole.name}. CONTEXT: ${state.currentRole.prompt}. RULE: START ROLEPLAY IMMEDIATELY. NO PREAMBLE. ENGLISH ONLY. NO BANGLA.`;
        callAPI({ message: "START_ROLEPLAY", systemInstruction: sysPrompt });
    }

    // --- EMOTION DETECTION ---
    function detectSentiment(text) {
        const sadKeywords = ['sad', 'bad', 'sick', 'tired', 'unhappy', 'lonely', 'depressed', 'boring'];
        const happyKeywords = ['happy', 'great', 'awesome', 'good', 'excited', 'love'];
        const lowerText = text.toLowerCase();
        
        if (sadKeywords.some(word => lowerText.includes(word))) return "SAD";
        if (happyKeywords.some(word => lowerText.includes(word))) return "HAPPY";
        return "NEUTRAL";
    }

    async function sendToAI(text) {
        if(!text.trim()) return;

        // Bangla Warning Toast
        if(/[\u0980-\u09FF]/.test(text)) {
            const toast = document.getElementById('toast-warning');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        addUserMsg(text);
        const sentiment = detectSentiment(text); 
        
        // Memory Logic
        chatHistory.push(`User: ${text}`);
        if(chatHistory.length > 6) chatHistory.shift();

        document.getElementById('userInput').value = '';
        toggleTyping(true);

        const expertPrompt = `
            ACT AS: ${state.currentRole.name}. 
            ROLE CONTEXT: ${state.currentRole.prompt}
            [HUMAN-LIKE INTELLIGENCE]
            1. EMOTION: User seems ${sentiment}. Respond with empathy.
            2. MEMORY: History: ${chatHistory.join(' | ')}.
            3. BANGLADESHI MATE: Be a warm Bangladeshi friend. No Islamic/Iman conflicts.
            4. CORRECTION: Only major errors, use brackets e.g. (Correct: I went). 
            5. THE HOOK: Always end with a short, relevant question.
            6. NO LECTURES: Chat like a peer, not a professor.
            7. ENGLISH ONLY.
        `;

        callAPI({ message: text, systemInstruction: expertPrompt });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch('/api/chat', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            const data = await res.json();
            toggleTyping(false);
            
            let reply = data.reply.trim(); 
            if(reply.length < 5) reply = "That's interesting! Tell me more about it?"; 

            chatHistory.push(`AI: ${reply}`);
            addAiMsg(reply);
        } catch (e) { toggleTyping(false); addAiMsg("Oh! I missed that. Can you repeat please?"); }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    // --- TYPEWRITER EFFECT ---
    function typeWriter(text, element, callback) {
        let i = 0;
        const words = text.split(' ');
        element.innerText = '';
        
        function type() {
            if (i < words.length) {
                element.innerText += words[i] + ' ';
                i++;
                setTimeout(type, 50); // Speed
                scrollToBottom();
            } else if (callback) {
                callback();
            }
        }
        type();
    }

    function addAiMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble ai'; 
        document.getElementById('messages').appendChild(div);
        
        typeWriter(text, div, () => {
            speak(text);
        });
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
        document.getElementById('snd-pop').play().catch(e=>{});
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = (SpeechRecognition) ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'en-US';
        recognition.onstart = () => { isMicOn = true; document.getElementById('mic-btn').classList.add('listening'); };
        recognition.onend = () => { isMicOn = false; document.getElementById('mic-btn').classList.remove('listening'); };
        recognition.onresult = (e) => { 
            const txt = e.results[0][0].transcript;
            document.getElementById('userInput').value = txt;
            sendToAI(txt);
        };
    }
    
    function toggleMic() {
        if(!recognition) return alert("Mic not supported.");
        if(!isMicOn) recognition.start();
        else recognition.stop();
    }
</script>
</body>
</html>
