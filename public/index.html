<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Pure Spoken Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #002b20; --card: #001e17; --cyan: #00ffcc; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 🎨 Animated Intro Modal */
        #intro-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px); }
        .modal-content { background: var(--card); border: 2px solid var(--cyan); width: 90%; max-width: 420px; padding: 30px; border-radius: 30px; text-align: center; transform: scale(0.8); animation: popUp 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        @keyframes popUp { to { transform: scale(1); } }

        .app-header { background: var(--card); padding: 12px 15px; border-bottom: 2px solid #004d40; display: flex; justify-content: space-between; align-items: center; }
        .nav-right { display: flex; gap: 8px; }
        .btn-act { background: var(--cyan); color: black; border: none; padding: 7px 12px; border-radius: 20px; font-weight: 800; font-size: 10px; cursor: pointer; transition: 0.3s; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 180px; }
        .bubble { padding: 15px; border-radius: 20px; font-size: 16px; max-width: 85%; line-height: 1.6; }
        .ai-bubble { background: #00382e; align-self: flex-start; }
        .user-bubble { background: #005f6b; align-self: flex-end; }
        .word-hl { color: var(--gold); font-weight: 900; background: rgba(255, 215, 0, 0.2); border-radius: 4px; }

        /* 📊 Fixed Status Bar */
        .status-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); padding: 8px 0; border-top: 1px solid #004d40; display: flex; justify-content: space-around; font-size: 10px; font-weight: 900; color: #aabeb8; }
        .status-item span { color: var(--cyan); }

        /* 🎙️ Massive Animated Mic */
        .bottom-area { position: fixed; bottom: 50px; width: 100%; display: flex; justify-content: center; pointer-events: none; }
        #mic-btn { width: 110px; height: 110px; border-radius: 50%; background: #00382e; border: 8px solid var(--cyan); color: var(--cyan); font-size: 50px; cursor: pointer; pointer-events: auto; transition: 0.4s; box-shadow: 0 0 30px rgba(0, 255, 204, 0.3); }
        #mic-btn.active { border-color: #ff4500; color: #ff4500; animation: superPulse 1s infinite; }
        @keyframes superPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); } 70% { transform: scale(1.15); box-shadow: 0 0 0 30px rgba(0, 255, 204, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); } }

        .how-to { font-size: 12px; color: #aabeb8; background: #002b20; padding: 15px; border-radius: 15px; text-align: left; margin: 15px 0; border-left: 4px solid var(--cyan); }
    </style>
</head>
<body>

<div id="intro-modal">
    <div class="modal-content">
        <h2 style="color:var(--cyan); margin:0;">Talk24AI Lab</h2>
        <div class="how-to">
            📌 <b>How to Use:</b><br>
            1. Select your mode.<br>
            2. AI Mentor teaches situational tips.<br>
            3. Correct speaking = <b>100 XP</b>!<br>
            4. Level up every <b>200 XP</b>.
        </div>
        <button class="btn-act" style="width:100%; padding:15px; margin-bottom:10px;" onclick="start('Junior')">👶 JUNIOR MODE</button>
        <button class="btn-act" style="width:100%; padding:15px; margin-bottom:10px;" onclick="start('Senior')">👨‍🎓 SENIOR MODE</button>
        <button class="btn-act" style="width:100%; padding:15px;" onclick="start('Pro')">🚀 PRO MODE</button>
    </div>
</div>

<header class="app-header">
    <div style="font-weight:900; color:var(--cyan);">Talk24AI</div>
    <div class="nav-right">
        <button id="dl-app" class="btn-act">DOWNLOAD APP</button>
        <button class="btn-act" style="background:var(--gold);" onclick="dlPDF()">NOTES</button>
    </div>
</header>

<div id="messages"></div>

<div class="bottom-area"><button id="mic-btn" onclick="toggleMic()">🎙️</button></div>

<div class="status-bar">
    <div class="status-item">ID: <span id="st-uid">---</span></div>
    <div class="status-item">SCORE: <span id="st-score">0</span></div>
    <div class="status-item">LVL: <span id="st-lvl">1</span></div>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let UID = localStorage.getItem('t24_uid') || 'U-' + Date.now().toString().slice(-6);
    localStorage.setItem('t24_uid', UID);
    
    let score = parseInt(localStorage.getItem('t24_score')) || 0;
    let mode = localStorage.getItem('t24_mode') || 'Senior';
    let history = JSON.parse(localStorage.getItem('t24_history')) || [];

    function updateUI() {
        document.getElementById('st-uid').innerText = UID;
        document.getElementById('st-score').innerText = score;
        document.getElementById('st-lvl').innerText = Math.floor(score / 200) + 1;
        localStorage.setItem('t24_score', score);
        localStorage.setItem('t24_history', JSON.stringify(history));
    }

    function start(m) {
        mode = m; localStorage.setItem('t24_mode', m);
        document.getElementById('intro-modal').style.display = 'none';
        updateUI();
        if(history.length > 0) {
            history.forEach(msg => render(msg.text, msg.sender, false));
        } else {
            callAPI("Hello! Let's start.");
        }
    }

    async function callAPI(msg) {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ message: msg, userId: UID, mode: mode })
            });
            const data = await res.json();
            score = data.new_total_score;
            render(data.reply, 'ai', true);
            updateUI();
        } catch(e) { render("I'm here. 1. Yes! 2. Sure!", 'ai', false); }
    }

    function render(txt, sender, save) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-bubble`;
        const words = txt.split(' ');
        div.innerHTML = `<div class="speech">` + words.map(w => `<span>${w} </span>`).join('') + `</div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        if(save) history.push({ text: txt, sender: sender });
        if(sender === 'ai' && save) speak(txt, div.querySelector('.speech'));
        updateUI();
    }

    function speak(text, element) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        const spans = element.querySelectorAll('span');
        let idx = 0;
        ut.onboundary = (e) => {
            if (e.name === 'word' && spans[idx]) {
                spans.forEach(s => s.classList.remove('word-hl'));
                spans[idx].classList.add('word-hl'); idx++;
            }
        };
        window.speechSynthesis.speak(ut);
    }

    function toggleMic() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Speech recognition not supported.");
        const r = new Rec();
        const b = document.getElementById('mic-btn');
        b.classList.add('active');
        r.start();
        r.onresult = (e) => {
            b.classList.remove('active');
            const t = e.results[0][0].transcript;
            render(t, 'user', true); callAPI(t);
            // Highlight Download App
            const app = document.getElementById('dl-app');
            app.style.boxShadow = "0 0 20px var(--cyan)";
            setTimeout(() => app.style.boxShadow = "none", 3000);
        };
        r.onerror = () => b.classList.remove('active');
    }

    function dlPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Talk24AI Practice Notes", 20, 20);
        let y = 30;
        history.slice(-25).forEach(m => {
            if(y > 280) { doc.addPage(); y = 20; }
            doc.text(`${m.sender.toUpperCase()}: ${m.text.substring(0, 80)}`, 20, y);
            y += 10;
        });
        doc.save("Talk24AI_Notes.pdf");
    }
</script>
</body>
</html>
