<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | 400 Topics Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg-color: #002b20; --card-bg: #001e17; --input-bg: #00382e; --accent-cyan: #00ffcc; --text-white: #ffffff; --text-gray: #aabeb8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg-color); color: var(--text-white); height: 100vh; overflow: hidden; }

        /* SCREENS */
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; z-index: 5000; }
        .active-screen { display: flex; }

        .logo { font-family: 'Fredoka', sans-serif; font-size: 32px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .hero-card { width: 100%; max-width: 500px; background: var(--card-bg); border: 2px solid #004d40; border-radius: 25px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 15px; max-height: 90vh; }

        /* GRID FOR MODULES */
        .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .skill-option { background: var(--input-bg); border: 1px solid transparent; border-radius: 15px; padding: 20px 10px; cursor: pointer; text-align: center; }
        .skill-option:active { transform: scale(0.95); background: #004d40; }
        .skill-head { font-weight: 800; font-size: 16px; color: var(--accent-cyan); }
        .skill-sub { font-size: 10px; color: var(--text-gray); margin-top: 4px; }

        /* TOPIC SELECTION UI */
        .topic-scroll { overflow-y: auto; padding-right: 5px; margin-top: 10px; }
        .topic-group-header { background: #00382e; color: var(--accent-cyan); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; margin: 15px 0 8px 0; text-transform: uppercase; border-left: 3px solid var(--accent-cyan); }
        .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .topic-btn { background: rgba(255,255,255,0.05); border: 1px solid #004d40; padding: 12px 8px; border-radius: 10px; color: white; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; transition: 0.2s; }
        .topic-btn:hover { background: #004d40; border-color: var(--accent-cyan); }

        .btn-back { background: transparent; border: 1px solid var(--text-gray); color: var(--text-gray); padding: 6px 12px; border-radius: 8px; cursor: pointer; align-self: flex-start; font-size: 12px; }

        /* CHAT UI */
        .top-nav { padding: 12px 20px; background: var(--bg-color); border-bottom: 1px solid #004d40; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 600px; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; padding-bottom: 100px; }
        .bubble { padding: 12px 16px; border-radius: 15px; font-size: 15px; max-width: 85%; line-height: 1.4; }
        .ai-bubble { background: var(--input-bg); align-self: flex-start; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); align-self: flex-end; }
        .mentor-note { margin-top: 8px; font-size: 12px; color: var(--text-gray); border-left: 2px solid var(--accent-cyan); padding-left: 10px; font-style: italic; }

        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 15px; background: rgba(0, 30, 23, 0.95); display: flex; justify-content: center; }
        .input-deck { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        .input-box { flex: 1; background: var(--input-bg); border: 1px solid #004d40; border-radius: 12px; padding: 12px; color: white; outline: none; }
        #mic-btn { width: 50px; height: 50px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

<div id="home-screen" class="screen active-screen">
    <div class="logo">Talk24AI</div>
    <div class="hero-card">
        <div style="font-weight:900; color:var(--text-gray); font-size:11px; text-transform:uppercase;">Step 1: Select Module</div>
        <div class="skill-grid">
            <div class="skill-option" onclick="loadTopics('A')"><div class="skill-head">Beginner</div><div class="skill-sub">Kids (6-10 yrs)</div></div>
            <div class="skill-option" onclick="loadTopics('B')"><div class="skill-head">Learner</div><div class="skill-sub">Teens (10-16 yrs)</div></div>
            <div class="skill-option" onclick="loadTopics('C')"><div class="skill-head">Hesitant</div><div class="skill-sub">IELTS (17-24 yrs)</div></div>
            <div class="skill-option" onclick="loadTopics('D')"><div class="skill-head">Pro</div><div class="skill-sub">Adults (24-34 yrs)</div></div>
        </div>
    </div>
</div>

<div id="topic-screen" class="screen">
    <div class="hero-card">
        <button class="btn-back" onclick="changeScreen('home-screen')">← Back</button>
        <div style="font-weight:900; color:var(--accent-cyan); font-size:13px;">Step 2: Choose Your Mission Topic</div>
        <div id="topic-container" class="topic-scroll">
            </div>
    </div>
</div>

<div id="chat-screen" class="screen" style="padding:0;">
    <div class="top-nav">
        <div><div id="active-topic" style="font-weight:900; color:var(--accent-cyan); font-size:14px;">Topic</div><div id="active-mod" style="font-size:10px; color:var(--text-gray);">Module</div></div>
        <button onclick="location.reload()" style="background:transparent; border:1px solid #444; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Exit</button>
    </div>
    <div id="messages"></div>
    <div class="bottom-area">
        <div class="input-deck">
            <button id="mic-btn" onclick="toggleMic()">🎙️</button>
            <input type="text" id="userInput" class="input-box" placeholder="Start speaking..." onkeypress="if(event.key==='Enter')sendToAI(this.value)">
        </div>
    </div>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com"; 
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);

    let state = { module: null, topic: null };

    // 📘 FULL 400-TOPIC DATA STRUCTURE
    const FULL_SYLLABUS = {
        'A': {
            name: "Beginner",
            groups: [
                { title: "1-10: Greetings & Self", items: ["Hello & Hi", "Good Morning", "Good Night", "My Name", "My Age", "Boy or Girl?", "How are you?", "I am Fine", "Goodbye", "Thank You"] },
                { title: "11-20: Family", items: ["Mother", "Father", "Brother", "Sister", "Baby", "Grandfather", "Grandmother", "Uncle", "Aunt", "Cousin"] },
                { title: "21-30: Colors", items: ["Red Apple", "Blue Sky", "Green Grass", "Yellow Sun", "Orange Fruit", "Black Hair", "White Teeth", "Pink Flower", "Brown Bear", "Purple Dress"] },
                { title: "31-40: Counting & Sizes", items: ["One to Five", "Six to Ten", "Phone Number", "How Many Fingers?", "Count the Chairs", "First & Second", "Big & Small", "Tall & Short", "Heavy & Light", "Fast & Slow"] },
                { title: "41-50: Body Parts", items: ["My Head", "My Eyes", "My Nose", "My Mouth", "My Ears", "My Hands", "My Legs", "My Stomach", "My Hair", "My Teeth"] },
                { title: "51-60: Animals", items: ["Cat (Meow)", "Dog (Bark)", "Cow (Moo)", "Lion (Roar)", "Tiger", "Elephant", "Monkey", "Bird", "Fish", "Snake"] },
                { title: "61-70: Food & Drink", items: ["Drinking Water", "Milk", "Egg", "Bread", "Rice", "Chicken", "Apple", "Banana", "Mango", "Chocolate"] },
                { title: "71-80: House", items: ["My Room", "Bed", "Chair", "Table", "Door", "Window", "Fan", "Light", "TV", "Kitchen"] },
                { title: "81-90: School", items: ["School Bag", "Pencil", "Pen", "Book", "Eraser", "Ruler", "Sharpener", "Tiffin Box", "Water Bottle", "Blackboard"] },
                { title: "91-100: Actions", items: ["Run", "Jump", "Eat", "Sleep", "Drink", "Play", "Walk", "Sit Down", "Stand Up", "Clap Hands"] }
            ]
        },
        'B': {
            name: "Learner",
            groups: [
                { title: "1-10: School Life", items: ["My School", "Favorite Teacher", "Best Friend", "Homework", "Exam Fear", "Lunch Break", "School Bus", "Library", "Sports Day", "Late for Class"] },
                { title: "11-20: Hobbies", items: ["Cricket", "Football", "Mobile Games", "Drawing", "Singing", "Dancing", "Storybooks", "Cycling", "Swimming", "Gardening"] },
                { title: "21-30: Technology", items: ["Smartphone", "YouTube", "Selfies", "Facebook", "Online Games", "WiFi Issues", "Charging Phone", "Cartoons", "Action Movies", "Listening to Music"] },
                { title: "31-40: Food & Restaurants", items: ["Pizza", "Burger", "Ice Cream", "Biryani", "Noodles", "Spicy Food", "Ordering Food", "Street Food", "Favorite Drink", "Simple Cooking"] },
                { title: "41-50: Daily Routine", items: ["Waking Up", "Brushing Teeth", "Taking Bath", "Getting Dressed", "Breakfast", "Going to School", "Afternoon Nap", "Evening Study", "Dinner Time", "Going to Sleep"] },
                { title: "51-60: Emotions", items: ["Happy", "Sad", "Angry", "Scared", "Bored", "Excited", "Nervous", "Hungry", "Thirsty", "Surprised"] },
                { title: "61-70: Shopping", items: ["Buying Toys", "Buying Clothes", "Shoe Shop", "Grocery Store", "Asking Price", "Pocket Money", "Saving Money", "Buying Gift", "Supermarket", "Bargaining"] },
                { title: "71-80: Travel", items: ["Zoo Visit", "Park", "Picnic", "Village Home", "Train Journey", "Bus Ride", "Boat Ride", "Family Trip", "Museum", "Holiday Plan"] },
                { title: "81-90: Weather", items: ["Hot Summer", "Rainy Day", "Cold Winter", "Stormy Night", "Rainbow", "Flowers", "Trees", "River", "Moon & Stars", "Clouds"] },
                { title: "91-100: Social", items: ["Saying Sorry", "Asking Help", "Greeting Elders", "Making Friends", "Sharing Food", "Helping Mom", "Guests", "Phone Call", "Birthday Party", "Festivals"] }
            ]
        },
        'C': {
            name: "Hesitant",
            groups: [
                { title: "1-10: IELTS Prep", items: ["Hometown", "Work or Study", "Accommodation", "Neighbors", "Transport", "Weather Choice", "Gift Giving", "Mirrors", "Robots", "Leisure Time"] },
                { title: "11-20: Social Issues", items: ["Traffic Jams", "Pollution", "Global Warming", "Unemployment", "Poverty", "Corruption", "Gender Equality", "Mental Health", "Fast Fashion", "Plastic Ban"] },
                { title: "21-30: University", items: ["Choosing Major", "Campus Life", "Roommates", "Assignments", "Group Study", "Part-time Job", "Student Loans", "Studying Abroad", "Graduation", "Ragging"] },
                { title: "31-40: Ethics", items: ["AI vs Humans", "Social Media", "Data Privacy", "Cyberbullying", "Online Learning", "Space Travel", "Automation", "Gadgets", "Video Games", "Inventions"] },
                { title: "41-50: Travel & Culture", items: ["Solo Travel", "Adventure Sports", "Cultural Shock", "Traditional Food", "Historical Places", "Visa Process", "Hotel Booking", "Lost Luggage", "Languages", "Festivals"] },
                { title: "51-60: Relationships", items: ["Friendship", "Long Distance", "Generation Gap", "Marriage Views", "Nuclear Family", "Trust Issues", "Breakups", "Networking", "Intro vs Extro", "Peer Pressure"] },
                { title: "61-70: Health", items: ["Gym & Fitness", "Healthy Diet", "Meditation", "Yoga", "Fast Food", "Sleep Habits", "Hospitals", "Insurance", "Cleanliness", "Organic Food"] },
                { title: "71-80: Abstract", items: ["Success", "Money/Happiness", "Leadership", "Patience", "Luck vs Work", "Discipline", "Creativity", "Honesty", "Freedom", "Regret"] },
                { title: "81-90: Entertainment", items: ["Movie Reviews", "Binge Watching", "Reading Habits", "Music Genres", "Celebrity", "Reality TV", "Art Galleries", "Concerts", "Theater", "Photography"] },
                { title: "91-100: Practical", items: ["Bank Account", "Renting", "Complaining", "Directions", "Graph Description", "Making Plans", "Convincing", "Interview Prep", "CV Writing", "Public Speaking"] }
            ]
        },
        'D': {
            name: "Professional",
            groups: [
                { title: "1-10: Interview", items: ["Self Intro", "Strengths", "Why Hire?", "Salary", "5-Year Plan", "Failure", "Leadership", "Resume Gap", "Interview Questions", "Negotiation"] },
                { title: "11-20: Meetings", items: ["Agenda Setting", "Opening", "Brainstorming", "Taking Minutes", "Status Updates", "Problem Solving", "Asking Opinion", "Agreeing", "Closing", "Zoom Etiquette"] },
                { title: "21-30: Communication", items: ["Email Writing", "Phone Etiquette", "Small Talk", "Persuasion", "Active Listening", "Feedback", "Criticism", "Presentation", "Report Writing", "Networking"] },
                { title: "31-40: Office", items: ["Teamwork", "Office Politics", "Work-Life", "Remote Work", "Commuting", "Lunch Breaks", "Desk Org", "Office Attire", "Coffee Chat", "Holiday Leave"] },
                { title: "41-50: Leadership", items: ["Motivating Team", "Delegating", "Mentoring", "Decision Making", "Time Management", "Strategic", "Conflict", "Team Building", "Hiring", "Firing"] },
                { title: "51-60: Concepts", items: ["Marketing", "Sales Pitch", "Profit & Loss", "ROI", "KPIs", "Startups", "Investments", "Customer Service", "Branding", "Supply Chain"] },
                { title: "61-70: Clients", items: ["Pitching", "Closing Deals", "Complaints", "Satisfaction", "Follow-ups", "CRM Systems", "Business Lunch", "Contracting", "Business Cards", "Events"] },
                { title: "71-80: HR", items: ["Resignation", "Promotion", "Sick Leave", "Performance", "LinkedIn", "Cover Letter", "References", "Harassment", "Inclusion", "Culture"] },
                { title: "81-90: Tech", items: ["Data Analysis", "PM Tools", "Cybersecurity", "Cloud Computing", "Automation", "AI in Biz", "E-commerce", "Digital Marketing", "Support", "Updates"] },
                { title: "91-100: Global", items: ["Culture Gaps", "Time Zones", "Travel", "Currency", "Global Markets", "Export/Import", "Translation", "Manners", "Gifts", "Ethics"] }
            ]
        }
    };

    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
    }

    function loadTopics(modCode) {
        state.module = modCode;
        const container = document.getElementById('topic-container');
        container.innerHTML = "";
        
        FULL_SYLLABUS[modCode].groups.forEach(group => {
            const header = document.createElement('div');
            header.className = "topic-group-header";
            header.innerText = group.title;
            container.appendChild(header);

            const grid = document.createElement('div');
            grid.className = "topic-grid";
            group.items.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = "topic-btn";
                btn.innerText = topic;
                btn.onclick = () => startMission(topic);
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        });
        changeScreen('topic-screen');
    }

    function startMission(topicName) {
        state.topic = topicName;
        document.getElementById('active-topic').innerText = topicName;
        document.getElementById('active-mod').innerText = FULL_SYLLABUS[state.module].name;
        changeScreen('chat-screen');
        callAPI({ message: `Action! Mission Start: ${topicName}`, systemInstruction: `Skill Level: ${state.module}`, userId: USER_ID });
    }

    async function sendToAI(text) {
        if(!text.trim()) return;
        addMsg(text, 'user');
        document.getElementById('userInput').value = '';
        callAPI({ message: text, systemInstruction: `Skill Level: ${state.module}`, userId: USER_ID });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            const data = await res.json();
            addMsg(data.reply, 'ai', data.instruction);
        } catch(e) {}
    }

    function addMsg(t, sender, note) {
        const box = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `bubble ${sender}-bubble`;
        d.innerHTML = sender === 'ai' && note ? `${t}<div class="mentor-note">${note}</div>` : t;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        if(sender === 'ai') { const u = new SpeechSynthesisUtterance(t); u.rate = 0.95; window.speechSynthesis.speak(u); }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = SpeechRecognition ? new SpeechRecognition() : null;
    function toggleMic() {
        if(!rec) return alert("Mic not supported.");
        rec.start();
        rec.onresult = (e) => sendToAI(e.results[0][0].transcript);
    }
</script>
</body>
</html>
