<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Pure Spoken Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #002b20; --card: #001e17; --cyan: #00ffcc; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 🎨 Popup CSS Animation */
        #intro-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px); animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content { background: var(--card); border: 2px solid var(--cyan); width: 90%; max-width: 420px; padding: 30px; border-radius: 30px; text-align: center; transform: translateY(50px); animation: slideUp 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        @keyframes slideUp { to { transform: translateY(0); } }

        /* 📱 Header & Actions */
        .app-header { background: var(--card); padding: 12px 15px; border-bottom: 2px solid #004d40; display: flex; justify-content: space-between; align-items: center; }
        .nav-right { display: flex; gap: 8px; align-items: center; }
        .action-btn { background: var(--cyan); color: black; border: none; padding: 8px 12px; border-radius: 20px; font-weight: 800; font-size: 10px; cursor: pointer; transition: 0.3s; }
        #mode-selector { background: var(--card); color: var(--cyan); border: 1px solid var(--cyan); border-radius: 8px; font-size: 11px; padding: 5px; font-weight: 700; cursor: pointer; }

        /* 💬 Chat Box */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 160px; }
        .bubble { padding: 15px; border-radius: 20px; font-size: 16px; max-width: 85%; line-height: 1.6; }
        .ai-bubble { background: #00382e; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-bubble { background: #005f6b; align-self: flex-end; border-bottom-right-radius: 4px; }
        .word-hl { color: var(--gold); font-weight: 900; background: rgba(255, 215, 0, 0.2); border-radius: 4px; }

        /* 🎤 Large Mic Area */
        .bottom-area { position: fixed; bottom: 45px; width: 100%; display: flex; justify-content: center; pointer-events: none; }
        #mic-btn { width: 100px; height: 100px; border-radius: 50%; background: #00382e; border: 6px solid var(--cyan); color: var(--cyan); font-size: 45px; cursor: pointer; pointer-events: auto; transition: 0.3s; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        #mic-btn.active { animation: superPulse 1.2s infinite; border-color: #ff4500; color: #ff4500; }
        @keyframes superPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); } 70% { transform: scale(1.15); box-shadow: 0 0 0 30px rgba(0, 255, 204, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); } }

        /* 📊 Bottom Status Bar */
        .status-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); padding: 8px 0; border-top: 1px solid #004d40; display: flex; justify-content: space-around; font-size: 10px; font-weight: 900; color: #aabeb8; }
        .status-item span { color: var(--cyan); }

        .how-to-guide { text-align: left; font-size: 13px; color: #aabeb8; background: #002b20; padding: 15px; border-radius: 15px; margin: 15px 0; border-left: 4px solid var(--cyan); }
    </style>
</head>
<body>

<div id="intro-modal">
    <div class="modal-content">
        <h2 style="color:var(--cyan); margin-top:0;">English Mastery Lab</h2>
        <div class="how-to-guide">
            🚀 <b>How to use:</b><br>
            1. Select your learning level.<br>
            2. AI Mentor teaches & asks quizzes.<br>
            3. Use the 🎙️ <b>Large Mic</b> to speak.<br>
            4. Correct answer = <b>100 XP</b>!
        </div>
        <button class="action-btn" style="width:100%; padding:15px; margin-bottom:10px;" onclick="startSession('Junior')">👶 JUNIOR MODE</button>
        <button class="action-btn" style="width:100%; padding:15px; margin-bottom:10px;" onclick="startSession('Senior')">👨‍🎓 SENIOR MODE</button>
        <button class="action-btn" style="width:100%; padding:15px;" onclick="startSession('Pro')">🚀 PRO MODE</button>
    </div>
</div>

<header class="app-header">
    <div>
        <div style="color:var(--cyan); font-weight:900; font-size:20px;">Talk24AI</div>
        <select id="mode-selector" onchange="changeMode(this.value)">
            <option value="Junior">Junior Mode</option>
            <option value="Senior" selected>Senior Mode</option>
            <option value="Pro">Pro Mode</option>
        </select>
    </div>
    <div class="nav-right">
        <button id="btn-app" class="action-btn">DOWNLOAD APP</button>
        <button class="action-btn" style="background:var(--gold);" onclick="downloadPDF()">DOWNLOAD NOTES</button>
    </div>
</header>

<div id="messages"></div>

<div class="bottom-area"><button id="mic-btn" onclick="toggleMic()">🎙️</button></div>

<div class="status-bar">
    <div class="status-item">UID: <span id="st-uid">---</span></div>
    <div class="status-item">SCORE: <span id="st-score">0</span></div>
    <div class="status-item">LEVEL: <span id="st-lvl">1</span></div>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let UID = localStorage.getItem('t24_uid') || 'U-' + Date.now().toString().slice(-8);
    localStorage.setItem('t24_uid', UID);
    
    let totalScore = parseInt(localStorage.getItem('t24_score')) || 0;
    let currentMode = localStorage.getItem('t24_mode') || 'Senior';
    let chatHistory = JSON.parse(localStorage.getItem('t24_history')) || [];

    function updateUI() {
        document.getElementById('st-uid').innerText = UID;
        document.getElementById('st-score').innerText = totalScore;
        document.getElementById('st-lvl').innerText = Math.floor(totalScore / 200) + 1;
        document.getElementById('mode-selector').value = currentMode;
        localStorage.setItem('t24_score', totalScore);
        localStorage.setItem('t24_history', JSON.stringify(chatHistory));
    }

    function startSession(mode) {
        currentMode = mode;
        localStorage.setItem('t24_mode', mode);
        document.getElementById('intro-modal').style.display = 'none';
        updateUI();
        
        // Load persistent history
        if(chatHistory.length > 0) {
            chatHistory.forEach(msg => renderMsg(msg.text, msg.sender, false));
        } else {
            callAPI("Hello! I want to start my English journey.");
        }
    }

    async function callAPI(msg) {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ message: msg, userId: UID, mode: currentMode })
            });
            const data = await res.json();
            totalScore = data.new_total_score;
            renderMsg(data.reply, 'ai', true);
            updateUI();
        } catch(e) { renderMsg("Ready! 1. Yes, 2. No", 'ai', false); }
    }

    function renderMsg(txt, sender, shouldSave) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-bubble`;
        
        const words = txt.split(' ');
        div.innerHTML = `<div class="speech-box">` + words.map(w => `<span>${w} </span>`).join('') + `</div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        if(shouldSave) chatHistory.push({ text: txt, sender: sender });
        if(sender === 'ai' && shouldSave) speak(txt, div.querySelector('.speech-box'));
        updateUI();
    }

    function speak(text, element) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        ut.voice = voices.find(v => v.name.includes('Male')) || voices[0];
        ut.rate = currentMode === 'Junior' ? 0.85 : 1.0;
        
        const spans = element.querySelectorAll('span');
        let idx = 0;
        ut.onboundary = (e) => {
            if (e.name === 'word' && spans[idx]) {
                spans.forEach(s => s.classList.remove('word-hl'));
                spans[idx].classList.add('word-hl'); idx++;
            }
        };
        window.speechSynthesis.speak(ut);
    }

    function toggleMic() {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Recognition) return alert("Speech recognition not supported.");
        const rec = new Recognition();
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        
        rec.start();
        rec.onresult = (e) => {
            btn.classList.remove('active');
            const transcript = e.results[0][0].transcript;
            renderMsg(transcript, 'user', true);
            callAPI(transcript);
            
            // Highlight Download App button
            const appBtn = document.getElementById('btn-app');
            appBtn.style.animation = "glow 0.8s ease-in-out 3";
            setTimeout(() => appBtn.style.animation = "", 3000);
        };
        rec.onerror = () => btn.classList.remove('active');
    }

    function changeMode(m) {
        currentMode = m;
        localStorage.setItem('t24_mode', m);
        updateUI();
        renderMsg(`System: Switching to ${m} mode...`, 'ai', false);
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16); doc.text("Talk24AI Spoken Notes", 20, 20);
        doc.setFontSize(10);
        let y = 35;
        chatHistory.slice(-20).forEach(msg => {
            if(y > 280) { doc.addPage(); y = 20; }
            doc.text(`${msg.sender.toUpperCase()}: ${msg.text.substring(0, 80)}...`, 20, y);
            y += 8;
        });
        doc.save(`English_Notes_${Date.now()}.pdf`);
    }

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
