<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Talk24AI | #1 Spoken English Practice Lab & AI Mentor</title>
    <meta name="description" content="Master Spoken English with AI. 400 topics, real-time assessment, and gamified missions.">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --bg: #002b20; --card: #001e17; --input: #00382e; --cyan: #00ffcc; --gray: #aabeb8; --fire: #ff4500; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; overflow: hidden; user-select: none; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; z-index: 5000; }
        .active-screen { display: flex; }
        .hero-card { width: 100%; max-width: 550px; background: var(--card); border: 2px solid #004d40; border-radius: 25px; padding: 25px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .stats-bar { display: flex; justify-content: space-between; width: 100%; max-width: 450px; margin-bottom: 10px; }
        .stat-val { font-size: 16px; font-weight: 900; color: var(--cyan); }
        .hook-box { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 15px; text-align: center; border: 1px dashed #004d40; }
        .progress-track { flex: 1; height: 8px; background: #00382e; border-radius: 5px; }
        .progress-fill { height: 100%; background: var(--cyan); border-radius: 5px; transition: width 0.5s; box-shadow: 0 0 10px var(--cyan); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 600px; padding-bottom: 150px; }
        .bubble { padding: 12px 16px; border-radius: 15px; font-size: 15px; max-width: 85%; }
        .ai-bubble { background: var(--input); align-self: flex-start; border: 1px solid #004d40; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); align-self: flex-end; }
        .assessment-card { margin-top: 10px; padding: 12px; border: 1.5px solid var(--cyan); border-radius: 10px; font-size: 11px; color: var(--cyan); font-weight: 800; background: rgba(0, 255, 204, 0.05); }
        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 25px; background: linear-gradient(to top, var(--bg) 80%, transparent); display: flex; justify-content: center; backdrop-filter: blur(10px); }
        #mic-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--input); border: 4px solid var(--cyan); color: var(--cyan); font-size: 32px; cursor: pointer; position: relative; }
        .mic-badge { position: absolute; top: -10px; right: -10px; background: var(--gold); color: black; font-size: 9px; padding: 3px 6px; border-radius: 6px; font-weight: 900; }
        .topic-scroll { flex: 1; overflow-y: auto; width: 100%; }
        .topic-group { background: #00382e; color: var(--cyan); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 900; margin: 15px 0 10px 0; border-left: 4px solid var(--cyan); }
        .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .topic-btn { background: rgba(255,255,255,0.05); border: 1px solid #004d40; padding: 15px; border-radius: 12px; color: white; font-size: 13px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<div id="home-screen" class="screen active-screen">
    <div style="font-family:'Fredoka'; color:var(--cyan); font-size:40px; margin-bottom:15px;">Talk24AI</div>
    <div class="stats-bar">
        <div><div style="font-size:10px; color:var(--gray);">Level</div><div class="stat-val" id="home-lvl">1</div></div>
        <div style="text-align:right;"><div style="font-size:10px; color:var(--gray);">Total XP</div><div class="stat-val" id="home-xp">0</div></div>
    </div>
    <div class="hero-card">
        <div class="hook-box">
            <div style="font-size:13px; color:#ffab91; font-weight:800;">Tired of "Freezing" in English?</div>
            <div style="font-size:12px; color:var(--cyan); font-weight:700;">🚀 Speak with AI & Get Real-Time Mastery Reports!</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="skill-opt" onclick="loadTopics('A')"><div style="font-weight:900; color:var(--cyan);">BEGINNER</div><div style="font-size:10px; color:var(--gray);">Kids (6-10)</div></div>
            <div class="skill-opt" onclick="loadTopics('B')"><div style="font-weight:900; color:var(--cyan);">LEARNER</div><div style="font-size:10px; color:var(--gray);">Teens (10-16)</div></div>
            <div class="skill-opt" onclick="loadTopics('C')"><div style="font-weight:900; color:var(--cyan);">HESITANT</div><div style="font-size:10px; color:var(--gray);">IELTS (17-24)</div></div>
            <div class="skill-opt" onclick="loadTopics('D')"><div style="font-weight:900; color:var(--cyan);">PRO</div><div style="font-size:10px; color:var(--gray);">Adults (24-34)</div></div>
        </div>
        <button style="background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:10px; border-radius:12px; font-weight:800; cursor:pointer; font-size:11px; margin-top:5px;" onclick="installApp()">📲 DOWNLOAD APP</button>
    </div>
</div>

<div id="topic-screen" class="screen">
    <div class="hero-card">
        <button onclick="location.reload()" style="background:transparent; color:var(--gray); border:1.5px solid #444; padding:8px 15px; border-radius:10px; align-self:flex-start; cursor:pointer; font-weight:800; font-size:10px;">← BACK</button>
        <div id="topic-container" class="topic-scroll"></div>
    </div>
</div>

<div id="chat-screen" class="screen" style="padding:0; justify-content:flex-start;">
    <div class="top-nav">
        <div class="badge" id="chat-lvl">LVL 1</div>
        <div style="color:var(--fire); font-weight:900; font-size:12px;" id="streak-box">🔥 0</div>
        <div class="progress-track"><div class="progress-fill" id="xp-bar"></div></div>
        <button onclick="downloadReport()" style="background:var(--cyan); border:none; padding:8px 12px; border-radius:8px; font-weight:900; font-size:10px; color:#001e17;">💾 REPORT</button>
    </div>
    <div id="messages"></div>
    <div class="bottom-area">
        <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <button id="mic-btn" onclick="toggleMic()">🎙️ <span class="mic-badge">2X XP</span></button>
            <div style="font-size: 10px; color: var(--gray); font-weight: 800; text-transform: uppercase;">Speak for Double Points</div>
        </div>
    </div>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com"; 
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);
    let state = { score: parseInt(localStorage.getItem('talk24_score')) || 0, streak: 0, notes: [] };

    const SYLLABUS = {
        'A': [{t: "1-10: GREETINGS 👋", i: ["Hello & Hi", "Good Morning", "My Name", "How are you?"]}],
        'B': [{t: "1-10: SCHOOL 🏫", i: ["My School", "Favorite Teacher", "Best Friend", "Homework"]}],
        'C': [{t: "1-10: IELTS 🎓", i: ["Hometown", "Accommodation", "Neighbors", "Transport"]}],
        'D': [{t: "1-10: CAREER 👔", i: ["Self Intro", "Strengths", "Salary", "Leadership"]}]
    };

    window.onload = async () => {
        updateUI(state.score);
        try {
            const res = await fetch(`${SERVER_URL}/api/stats`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: USER_ID}) });
            const data = await res.json();
            updateUI(data.score, data.streak);
        } catch(e) {}
    };

    function updateUI(s, streak = 0) {
        state.score = s; localStorage.setItem('talk24_score', s);
        const lvl = Math.floor(s/1000)+1;
        document.getElementById('home-lvl').innerText = lvl;
        document.getElementById('home-xp').innerText = s;
        document.getElementById('chat-lvl').innerText = `LVL ${lvl}`;
        document.getElementById('streak-box').innerText = `🔥 ${streak}`;
        document.getElementById('xp-bar').style.width = `${(s % 1000 / 1000) * 100}%`;
    }

    function loadTopics(m) {
        state.mod = m;
        const container = document.getElementById('topic-container');
        container.innerHTML = "";
        SYLLABUS[m].forEach(g => {
            const h = document.createElement('div'); h.className="topic-group"; h.innerText=g.t; container.appendChild(h);
            const grid = document.createElement('div'); grid.className="topic-grid";
            g.i.forEach(topic => {
                const b = document.createElement('button'); b.className="topic-btn"; b.innerText=topic;
                b.onclick = () => startMission(topic); grid.appendChild(b);
            });
            container.appendChild(grid);
        });
        document.getElementById('home-screen').classList.remove('active-screen');
        document.getElementById('topic-screen').classList.add('active-screen');
    }

    function startMission(t) {
        state.topic = t;
        document.getElementById('topic-screen').classList.remove('active-screen');
        document.getElementById('chat-screen').classList.add('active-screen');
        callAPI({ message: `Mission Start: ${t}`, systemInstruction: `Skill Level: ${state.mod}`, userId: USER_ID, inputType: 'click' });
    }

    async function sendToAI(text, type = 'click') {
        if(!text.trim()) return;
        const d = document.createElement('div'); d.className = 'bubble user-bubble'; d.innerText = text;
        document.getElementById('messages').appendChild(d);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        callAPI({ message: text, systemInstruction: `Skill Level: ${state.mod}`, userId: USER_ID, inputType: type });
    }

    async function callAPI(payload) {
        const mic = document.getElementById('mic-btn'); mic.style.opacity = "0.5";
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            const data = await res.json();
            mic.style.opacity = "1";
            if(data.score_added > 0) {
                document.getElementById('snd-success').play();
                confetti({ particleCount: 30, origin: { y: 0.8 }, colors: payload.inputType==='voice'?['#ffd700','#00ffcc']:['#00ffcc'] });
                updateUI(data.new_total_score, data.streak);
            }
            renderAiMsg(data.reply, data.performance, data.notes);
        } catch(e) { mic.style.opacity = "1"; }
    }

    function renderAiMsg(reply, perf, notes) {
        const box = document.getElementById('messages');
        const d = document.createElement('div'); d.className = 'bubble ai-bubble';
        
        let cleanText = reply; let choices = [];
        // 🛠️ FIX: Regex matches options with or without brackets
        const match = reply.match(/\[?\s*A[\.:]\s*(.*?)\s*\|\s*B[\.:]\s*(.*?)\s*\]?/);
        if(match) { cleanText = reply.replace(match[0], "").trim(); choices = [match[1].trim(), match[2].trim()]; }
        else { choices = ["Tell me more!", "That's cool!"]; }

        d.innerHTML = `<div>${cleanText}</div>`;
        if(perf) {
            let displayPerf = typeof perf === 'object' ? JSON.stringify(perf).replace(/[{}"]/g, '') : perf;
            d.innerHTML += `<div class="assessment-card">📊 ASSESSMENT: ${displayPerf}</div>`;
        }
        if(notes) d.innerHTML += `<div style="font-size:11px; color:var(--gray); margin-top:8px; border-left:2px solid var(--cyan); padding-left:8px;">${notes.replace(/\\n/g, '<br>')}</div>`;
        
        const cBox = document.createElement('div'); cBox.style.display="flex"; cBox.style.gap="8px"; cBox.style.marginTop="12px";
        choices.forEach(c => {
            const b = document.createElement('button'); b.className='choice-btn'; b.style="background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:8px 12px; border-radius:15px; font-size:12px; cursor:pointer;";
            b.innerText = c; b.onclick = () => sendToAI(c, 'click'); cBox.appendChild(b);
        });
        d.appendChild(cBox);
        box.appendChild(d); box.scrollTop = box.scrollHeight;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(cleanText));
    }

    let dp; window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); dp = e; });
    async function installApp() { if(dp) dp.prompt(); else alert("Try browser menu to install."); }

    const rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = rec ? new rec() : null;
    function toggleMic() { if(!recognition) return alert("Mic not supported."); recognition.start(); recognition.onresult=(e)=>sendToAI(e.results[0][0].transcript, 'voice'); }
</script>
</body>
</html>
