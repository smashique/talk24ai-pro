<style>
    .xp-hint { font-size: 10px; color: #ff8c00; font-weight: 800; text-align: center; margin-top: 5px; animation: flash 2s infinite; }
    .mic-badge { position: absolute; top: -5px; right: -5px; background: gold; color: black; font-size: 8px; padding: 2px 5px; border-radius: 5px; font-weight: 900; box-shadow: 0 0 10px gold; }
    @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>

<div class="input-deck" style="position:relative;">
    <button id="mic-btn" onclick="toggleMic()">
        🎙️ <span class="mic-badge">2X XP</span>
    </button>
    <input type="text" id="userInput" class="input-box" placeholder="Speak or Type...">
</div>

<script>
    // ... (পূর্বের state ও helper ফাংশন)

    async function sendToAI(text, type = 'click') {
        if(!text.trim()) return;
        addMsg(text, 'user');
        document.getElementById('userInput').value = "";
        
        // API কল করার সময় type পাঠিয়ে দেওয়া হচ্ছে
        callAPI({ message: text, systemInstruction: `Skill Level: ${state.mod}`, userId: USER_ID, inputType: type });
    }

    function renderAiMsg(reply, perf, notes) {
        // ... (পূর্বের রেন্ডারিং লজিক)
        
        if(choices.length > 0) {
            const cBox = document.createElement('div');
            cBox.className = 'choice-box';
            choices.forEach(c => {
                const b = document.createElement('button');
                b.className='choice-btn';
                b.innerText = c;
                // বাটনে ক্লিক করলে type 'click' যাবে
                b.onclick = () => sendToAI(c, 'click'); 
                cBox.appendChild(b);
            });
            d.appendChild(cBox);
            
            // 💡 ইউজারকে জানানোর জন্য হিন্ট
            const hint = document.createElement('div');
            hint.className = 'xp-hint';
            hint.innerText = "🔥 SPEAK via Mic to earn 20 XP! (Click only gives 10)";
            d.appendChild(hint);
        }
        // ...
    }

    function toggleMic() { 
        if(!recognition) return alert("Mic not supported."); 
        recognition.start(); 
        recognition.onresult=(e)=> {
            const speech = e.results[0][0].transcript;
            // মাইক্রোফোন ব্যবহার করলে type 'voice' যাবে
            sendToAI(speech, 'voice'); 
        };
    }
</script>
