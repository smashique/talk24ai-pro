<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | #1 Spoken Lab</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #002b20; --card: #001e17; --input: #00382e; --cyan: #00ffcc; --gray: #aabeb8; --fire: #ff4500; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-header { background: var(--card); padding: 12px 15px; border-bottom: 2px solid #004d40; display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: var(--input); border: 1px solid var(--cyan); padding: 4px 10px; border-radius: 20px; color: var(--cyan); font-weight: 900; font-size: 11px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; max-width: 85%; line-height: 1.5; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ai-bubble { background: var(--input); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); align-self: flex-end; border-bottom-right-radius: 2px; }
        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 25px; background: linear-gradient(to top, var(--bg) 80%, transparent); display: flex; justify-content: center; backdrop-filter: blur(10px); }
        #mic-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--input); border: 4px solid var(--cyan); color: var(--cyan); font-size: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<header class="app-header">
    <div class="top-row">
        <div style="font-family:'Fredoka'; color:var(--cyan); font-size:22px;">Talk24AI</div>
        <button onclick="alert('Open browser menu > Install App')" style="background:var(--cyan); color:black; border:none; padding:6px 15px; border-radius:20px; font-weight:900; font-size:11px;">📲 DOWNLOAD APP</button>
    </div>
    <div class="top-row">
        <div style="font-size:10px; color:var(--gray);">UID: <span id="display-uid">...</span></div>
        <div style="display:flex; gap:10px; align-items:center;">
            <div id="streak-box" style="color:var(--fire); font-weight:900; font-size:12px;">🔥 0</div>
            <div id="chat-lvl" class="badge">LVL 1</div>
            <div style="font-size:11px; color:var(--gold); font-weight:900;">XP: <span id="home-xp">0</span></div>
        </div>
    </div>
</header>

<div id="messages"></div>

<div class="bottom-area">
    <button id="mic-btn" onclick="toggleMic()">🎙️</button>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);
    document.getElementById('display-uid').innerText = USER_ID;

    let state = { score: parseInt(localStorage.getItem('talk24_score')) || 0 };

    window.onload = () => {
        updateUI(state.score);
        callAPI({ message: "Action!", userId: USER_ID, inputType: 'click' });
    };

    function updateUI(s, streak = 0) {
        state.score = s; localStorage.setItem('talk24_score', s);
        const lvl = Math.floor(s/1000)+1;
        document.getElementById('home-xp').innerText = s;
        document.getElementById('chat-lvl').innerText = `LVL ${lvl}`;
        document.getElementById('streak-box').innerText = `🔥 ${streak}`;
    }

    async function callAPI(payload) {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            const data = await res.json();
            if(data.score_added > 5) { 
                document.getElementById('snd-success').play(); 
                confetti({ particleCount: 20, origin: { y: 0.8 } });
                updateUI(data.new_total_score); 
            }
            renderMsg(data.reply, 'ai');
        } catch(e) { renderMsg("Assalamu Alaikum! Can you try again?", 'ai'); }
    }

    function renderMsg(txt, sender) {
        const box = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `bubble ${sender}-bubble`;
        d.innerText = txt;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        if(sender === 'ai') speak(txt);
    }

    function speak(text) {
        const ut = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        // পুরুষ কণ্ঠ সিলেক্ট করার লজিক
        ut.voice = voices.find(v => v.name.includes('Male') || v.name.includes('David')) || voices[0];
        ut.rate = 0.9;
        window.speechSynthesis.speak(ut);
    }

    const rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = rec ? new rec() : null;
    function toggleMic() {
        if(!recognition) return alert("Mic not supported.");
        recognition.start();
        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            renderMsg(transcript, 'user');
            callAPI({ message: transcript, userId: USER_ID, inputType: 'voice' });
        }
    }

    // PWA Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
    }
</script>
</body>
</html>
