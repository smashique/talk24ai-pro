<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Your AI Spoken Mate</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --green: #58cc02; --green-shade: #46a302;
            --blue: #1cb0f6; --blue-shade: #1899d6;
            --bg: #ffffff; --font: 'Nunito', sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #3c3c3c; }

        /* --- SCREENS --- */
        #home-screen, #scenario-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        #scenario-screen { display: none; overflow-y: auto; justify-content: start; padding-top: 40px; }

        /* HERO STYLES */
        .logo { font-family: 'Fredoka', sans-serif; font-size: 42px; color: var(--green); margin-bottom: 5px; letter-spacing: -1px; }
        .trial-badge { background: #e5f6fd; color: #1cb0f6; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 13px; text-transform: uppercase; margin-bottom: 20px; border: 2px solid #1cb0f6; }
        
        .hero-card { width: 100%; max-width: 350px; background: #fff; border: 2px solid #e5e5e5; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 4px 0 #e5e5e5; }
        
        /* NEUROMARKETING TAGLINE STYLE */
        .pain-point-msg {
            color: #4b4b4b; margin-bottom: 25px; font-weight: 700; font-size: 16px; line-height: 1.6;
        }
        .pain-point-highlight {
            color: #d32f2f; font-weight: 900; /* Red to highlight the 'Problem' */
        }
        .solution-highlight {
            color: var(--green); font-weight: 900; /* Green to highlight 'Solution' */
        }

        .input-duo { width: 100%; padding: 14px; border: 2px solid #e5e5e5; border-radius: 15px; font-size: 16px; font-weight: 700; color: #555; background: #fdfdfd; outline: none; transition: 0.2s; }
        .input-duo:focus { border-color: var(--blue); background: #fff; }
        
        .btn-main { width: 100%; padding: 16px; margin-top: 15px; background: var(--green); color: white; font-size: 18px; font-weight: 800; border: none; border-radius: 16px; box-shadow: 0 4px 0 var(--green-shade); cursor: pointer; text-transform: uppercase; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        #install-btn {
            margin-top: 15px; background: white; color: var(--blue); border: 2px solid var(--blue); padding: 10px 20px; border-radius: 15px; font-weight: 800; font-size: 14px; cursor: pointer; display: none; align-items: center; gap: 8px; box-shadow: 0 4px 0 #e5e5e5;
        }
        #install-btn:active { transform: translateY(2px); box-shadow: none; }

        /* ROLE GRID */
        .sc-grid { width: 100%; max-width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 80px; }
        .role-card { background: white; border: 2px solid #e5e5e5; border-radius: 20px; padding: 20px; cursor: pointer; text-align: center; box-shadow: 0 4px 0 #e5e5e5; display: flex; flex-direction: column; align-items: center; }
        .role-card:active { transform: translateY(4px); box-shadow: none; border-color: var(--blue); }

        /* --- CHAT UI --- */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .top-nav { padding: 10px 20px; border-bottom: 2px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; background: #fff; z-index: 10; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 160px; }
        .bubble { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 16px; line-height: 1.5; font-weight: 600; }
        .ai { background: #f2f2f2; color: #4b4b4b; border-bottom-left-radius: 4px; border: 2px solid #e5e5e5; }
        .user { background: var(--blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 0 var(--blue-shade); }
        .typing { font-size: 12px; color: #aaa; margin-left: 20px; font-weight: 700; display: none; }

        /* --- BOTTOM CONTROLS --- */
        .bottom-area {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; padding: 15px 20px 25px 20px;
            border-top: 2px solid #f0f0f0;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            z-index: 200;
        }
        .input-row { width: 100%; display: flex; gap: 10px; max-width: 600px; }
        
        #mic-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: var(--green); border: 4px solid #fff;
            color: white; font-size: 30px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(88, 204, 2, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
        }
        #mic-btn:active { transform: translateX(-50%) scale(0.95); }
        .listening { background: #ff4b4b !important; animation: pulse 1.5s infinite; box-shadow: 0 0 0 10px rgba(255, 75, 75, 0.2) !important; }

        .wa-btn {
            position: fixed; bottom: 100px; right: 20px;
            background: #25d366; color: white;
            padding: 8px 16px 8px 10px; border-radius: 30px;
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; font-weight: 700; font-size: 13px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            border: 2px solid white; transition: 0.2s; z-index: 500;
        }
        .wa-btn:hover { transform: scale(1.05); }

        #toast-warning { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff4b4b; color: white; padding: 10px 20px; border-radius: 20px; font-weight: 800; display: none; z-index: 6000; }
        
        @keyframes pulse { 0% {transform: translateX(-50%) scale(1);} 50% {transform: translateX(-50%) scale(1.1);} 100% {transform: translateX(-50%) scale(1);} }
    </style>
</head>
<body>

<audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"></audio>
<div id="toast-warning">🚫 Please speak in English!</div>

<a href="https://wa.me/8801303680618?text=Hello%20Talk24AI,%20I%20have%20feedback..." target="_blank" class="wa-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.48 2 2 6.48 2 12.04C2 13.81 2.46 15.46 3.28 16.92L2 21.6L6.79 20.34C8.2 21.1 9.81 21.5 11.5 21.5H12.04C17.6 21.5 22.08 17.02 22.08 11.46C22.08 5.9 17.6 2 12.04 2ZM12.04 20C10.56 20 9.12 19.61 7.85 18.82L7.54 18.64L4.47 19.46L5.3 16.48L5.1 16.16C4.24 14.81 3.79 13.25 3.79 11.63C3.79 7.08 7.49 3.38 12.04 3.38C16.59 3.38 20.29 7.08 20.29 11.63C20.29 16.18 16.59 19.88 12.04 20Z"/></svg>
    Help / Feedback
</a>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    <div class="trial-badge">✨ Free Trial Active ✨</div>
    
    <div class="hero-card">
        <div class="pain-point-msg">
            Spoken English প্র্যাকটিস করার <span class="pain-point-highlight">পার্টনার পাচ্ছেন না?</span> <br>
            লজ্জা ভেঙে কথা বলুন <span class="solution-highlight">Talk24AI</span>-এর সাথে!
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="number" id="age" value="18" class="input-duo" style="text-align:center; font-weight:900;">
            <select id="gender" class="input-duo">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <button class="btn-main" onclick="showScenarios()">START PRACTICE</button>

        <button id="install-btn" onclick="installApp()">
            📲 Download App
        </button>
    </div>
</div>

<div id="scenario-screen">
    <div style="text-align:center; margin-bottom:20px;">
        <h2 style="margin:0; color:#4b4b4b;">Choose Character</h2>
        <p style="margin:5px 0 0 0; color:#888; font-size:14px; font-weight:700;">Tap to start talking</p>
    </div>
    <div class="sc-grid" id="role-grid"></div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <div id="p-icon" style="font-size: 30px;">🤖</div>
            <div>
                <div style="font-weight: 800; font-size: 16px;" id="p-name">Mate</div>
                <div style="font-size: 11px; color: #58cc02; font-weight: 800;">● ONLINE</div>
            </div>
        </div>
        <div style="background: #fff4db; color: #d68f00; padding: 5px 12px; border-radius: 20px; font-weight: 800; font-size: 14px;">💎 <span id="score">0</span></div>
    </div>

    <div id="messages"></div>
    <div id="typing-box" class="typing">Mate is typing...</div>

    <div class="bottom-area">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
        <div class="input-row">
            <input type="text" id="userInput" class="input-duo" placeholder="Type a message..." onkeypress="handleEnter(event)">
        </div>
    </div>
</div>

<script>
    const scenarios = {
        junior: [
            { name: "Islamic Storyteller", icon: "🕌", prompt: "Tell simple inspiring stories of Islamic Heroes. Keep sentences short. End with a question." },
            { name: "English Teacher", icon: "👩‍🏫", prompt: "Be a kind teacher. Ask about school. Correct gently in brackets." },
            { name: "Best Friend", icon: "🏸", prompt: "Talk about cricket or toys. Be very friendly." }
        ],
        senior: [
            { name: "Job Interviewer", icon: "💼", prompt: "Hiring Manager. Start asking: 'Tell me about yourself'. No intro." },
            { name: "IELTS Examiner", icon: "🇬🇧", prompt: "Formal IELTS Speaking Part 1. Focus on fluency." },
            { name: "Foreign Friend", icon: "🌏", prompt: "Traveler in Dhaka. Ask about local culture/food." }
        ]
    };

    let state = { age: 18, gender: 'Male', currentRole: null, score: 0 };
    let isMicOn = false;
    let chatHistory = [];
    let deferredPrompt; 

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'flex'; 
    });

    async function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('install-btn').style.display = 'none';
            }
            deferredPrompt = null;
        }
    }

    function showScenarios() {
        state.age = parseInt(document.getElementById('age').value);
        const list = (state.age < 13) ? scenarios.junior : scenarios.senior;
        const grid = document.getElementById('role-grid');
        grid.innerHTML = ''; 
        list.forEach(role => {
            const div = document.createElement('div');
            div.className = 'role-card';
            div.innerHTML = `<div style="font-size:40px; margin-bottom:5px;">${role.icon}</div><div style="font-weight:800; font-size:15px; color:#4b4b4b;">${role.name}</div>`;
            div.onclick = () => startChat(role);
            grid.appendChild(div);
        });
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('scenario-screen').style.display = 'flex';
    }

    function startChat(role) {
        state.currentRole = role;
        document.getElementById('p-icon').innerText = role.icon;
        document.getElementById('p-name').innerText = role.name;
        document.getElementById('scenario-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        triggerAIStart();
    }

    async function triggerAIStart() {
        toggleTyping(true);
        const sysPrompt = `IDENTITY: ${state.currentRole.name}. CONTEXT: ${state.currentRole.prompt}. RULE: Start immediately. English Only.`;
        callAPI({ message: "Hi! I am ready.", systemInstruction: sysPrompt });
    }

    async function sendToAI(text) {
        if(!text.trim()) return;
        if(/[\u0980-\u09FF]/.test(text)) {
            const toast = document.getElementById('toast-warning');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        addUserMsg(text);
        chatHistory.push(`User: ${text}`);
        if(chatHistory.length > 5) chatHistory.shift();
        document.getElementById('userInput').value = '';
        toggleTyping(true);
        const expertPrompt = `
            ACT AS: ${state.currentRole.name}.
            CONTEXT: ${state.currentRole.prompt}
            [RULES]
            1. SHORT & ENGAGING: Keep replies under 2-3 sentences.
            2. MEMORY: History: ${chatHistory.join(' | ')}.
            3. BANGLADESHI MATE: Be friendly. No Islamic conflicts.
            4. CORRECTION: Only major errors in brackets (Correct: ...).
            5. QUESTION: Always end with a question.
        `;
        callAPI({ message: text, systemInstruction: expertPrompt });
    }

    async function callAPI(payload) {
        try {
            const res = await fetch('/api/chat', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            const data = await res.json();
            toggleTyping(false);
            let reply = data.reply.trim();
            if(reply.length < 3) reply = "That's interesting! Tell me more.";
            chatHistory.push(`AI: ${reply}`);
            addAiMsg(reply);
        } catch (e) { toggleTyping(false); }
    }

    function toggleTyping(show) { document.getElementById('typing-box').style.display = show ? 'block' : 'none'; }

    function typeWriter(text, element, callback) {
        element.innerText = text; 
        scrollToBottom();
        if(callback) callback();
    }

    function addAiMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble ai'; 
        document.getElementById('messages').appendChild(div);
        typeWriter(text, div, () => speak(text));
    }

    function addUserMsg(text) {
        const div = document.createElement('div'); div.className = 'bubble user'; div.innerText = text;
        document.getElementById('messages').appendChild(div); scrollToBottom();
        state.score += 10; document.getElementById('score').innerText = state.score;
        document.getElementById('snd-pop').play().catch(e=>{});
    }

    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = (SpeechRecognition) ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'en-US';
        recognition.onstart = () => { isMicOn = true; document.getElementById('mic-btn').classList.add('listening'); };
        recognition.onend = () => { isMicOn = false; document.getElementById('mic-btn').classList.remove('listening'); };
        recognition.onresult = (e) => { 
            const txt = e.results[0][0].transcript;
            document.getElementById('userInput').value = txt;
            sendToAI(txt);
        };
    }
    
    function toggleMic() {
        if(!recognition) return alert("Mic not supported.");
        if(!isMicOn) recognition.start(); else recognition.stop();
    }
</script>
</body>
</html>
