<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Master English</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- 🎨 THEME: DARK CYBER ISLAMIC --- */
        :root { 
            --bg-color: #002b20;   /* Deepest Green Background */
            --card-bg: #001e17;    /* Dark Card */
            --input-bg: #00382e;   /* Input Fields Background */
            --text-white: #ffffff;
            --text-gray: #aabeb8;
            --accent-cyan: #00ffcc; /* Neon Cyan for Highlights */
            --btn-grad: linear-gradient(90deg, #ff8c00, #ff2e63); /* Orange-Red Gradient */
            --font: 'Nunito', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); margin: 0; background: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text-white); user-select: none; }

        /* --- 🌀 BACKGROUND --- */
        .bg-shape { position: absolute; border-radius: 50%; opacity: 0.1; z-index: -1; animation: float 30s infinite linear; filter: blur(80px); }
        .shape1 { width: 300px; height: 300px; background: #00ffcc; top: -10%; left: -10%; }
        .shape2 { width: 250px; height: 250px; background: #ff8c00; bottom: -10%; right: -10%; }
        @keyframes float { 0% { transform: translate(0, 0); } 50% { transform: translate(20px, 40px); } 100% { transform: translate(0, 0); } }

        /* --- 🏠 HOME SCREEN --- */
        #home-screen { position: fixed; inset: 0; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        
        .logo { font-family: 'Fredoka', sans-serif; font-size: 32px; color: var(--text-white); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; }

        /* STATS BAR (LIKE IMAGE) */
        .stats-bar { display: flex; justify-content: space-between; width: 100%; max-width: 420px; margin-bottom: 10px; padding: 0 10px; }
        .stat-label { font-size: 10px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 16px; font-weight: 900; color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }

        /* HERO CARD (DARK & PREMIUM) */
        .hero-card { 
            width: 100%; max-width: 420px; 
            background: var(--card-bg); 
            border: 2px solid #004d40;
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            display: flex; flex-direction: column; gap: 15px; 
        }
        
        /* HOOK BOX */
        .hook-box { 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 15px; padding: 15px; 
            text-align: center; border: 1px dashed #004d40;
            margin-bottom: 5px;
        }
        .pain-point { font-size: 13px; color: #ffab91; font-weight: 700; line-height: 1.4; margin-bottom: 5px; }
        .achievement-hook { font-size: 12px; color: var(--text-white); font-weight: 600; }

        /* INPUT LABELS */
        .section-label { font-size: 10px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; margin-bottom: -8px; margin-left: 5px; margin-top: 5px;}

        /* SKILL GRID (DARK INPUT STYLE) */
        .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .skill-option { 
            background: var(--input-bg); 
            border: 1px solid transparent; 
            border-radius: 12px; 
            padding: 15px 10px; cursor: pointer; transition: 0.2s; 
            text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .skill-option:active { transform: scale(0.98); background: #004d40; }
        
        /* SELECTED STATE (GLOW) */
        .skill-option.selected { 
            border-color: var(--accent-cyan); 
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); 
        }
        .skill-option.selected .skill-head { color: var(--accent-cyan); }
        
        .skill-option:last-child { grid-column: span 2; flex-direction: row; gap: 10px; padding: 12px; }
        
        .skill-head { font-weight: 700; font-size: 14px; color: var(--text-white); }
        .skill-sub { font-size: 10px; color: var(--text-gray); font-weight: 600; margin-top: 2px; }

        /* BUTTONS */
        .btn-start { 
            width: 100%; padding: 16px; 
            background: var(--btn-grad); 
            color: white; 
            font-size: 16px; font-weight: 900; 
            border: none; border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(255, 46, 99, 0.3); 
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; 
            margin-top: 10px; transition: 0.2s;
        }
        .btn-start:active { transform: translateY(3px); box-shadow: none; }

        #install-btn { 
            width: 100%; 
            background: white; 
            color: #002b20; 
            border: none; 
            padding: 12px; border-radius: 15px; 
            font-weight: 800; font-size: 14px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #install-btn:active { transform: translateY(2px); }

        /* --- 💬 CHAT SCREEN (DARK MODE) --- */
        #chat-screen { display: none; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: var(--card-bg); }
        .top-nav { padding: 10px 20px; background: var(--bg-color); border-bottom: 1px solid #004d40; display: flex; align-items: center; gap: 10px; height: 65px; color: white; }
        .level-badge { background: var(--input-bg); color: var(--accent-cyan); padding: 5px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; border: 1px solid var(--accent-cyan); }
        .progress-container { flex: 1; } .progress-track { height: 6px; background: #00382e; border-radius: 5px; } .progress-fill { height: 100%; background: var(--accent-cyan); width: 0%; border-radius: 5px; box-shadow: 0 0 10px var(--accent-cyan); transition: width 0.5s; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; width: fit-content; max-width: 85%; line-height: 1.5; }
        .ai-bubble { background: var(--input-bg); color: var(--text-white); border: 1px solid #004d40; border-bottom-left-radius: 2px; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 4px 10px rgba(0, 131, 176, 0.3); }
        .mentor-note { margin-top: 8px; background: #002b20; padding: 10px; border-radius: 8px; font-size: 13px; border-left: 2px solid var(--accent-cyan); color: #aabeb8; }

        .bottom-area { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: center; background: rgba(0, 30, 23, 0.9); backdrop-filter: blur(10px); }
        .input-deck { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        #mic-btn { width: 50px; height: 50px; border-radius: 12px; background: var(--input-bg); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #mic-btn.listening { background: #ff2e63; border-color: #ff2e63; color: white; animation: pulse 1s infinite; }
        .input-box { flex: 1; border: 1px solid #004d40; background: var(--input-bg); border-radius: 12px; padding: 0 15px; font-size: 16px; outline: none; color: white; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 46, 99, 0); } }

        /* MODAL */
        #level-up-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 7000; align-items: center; justify-content: center; }
        .levelup-card { background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; border: 2px solid var(--accent-cyan); box-shadow: 0 0 50px rgba(0, 255, 204, 0.3); }
    </style>
</head>
<body>

<audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
<audio id="snd-levelup" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<div class="bg-shape shape1"></div><div class="bg-shape shape2"></div>

<div id="level-up-modal">
    <div class="levelup-card">
        <div style="font-size:50px;">💎</div>
        <h2 style="color:var(--accent-cyan); margin:10px 0;">LEVEL UP!</h2>
        <p style="color:white;">Welcome to Level <span id="new-level-display">2</span></p>
        <button class="btn-start" style="padding:10px; font-size:14px;" onclick="closeLevelModal()">CONTINUE</button>
    </div>
</div>

<div id="home-screen">
    <div class="logo">Talk24AI</div>
    
    <div class="stats-bar">
        <div>
            <div class="stat-label">CURRENT LEVEL</div>
            <div class="stat-value">LEVEL <span id="home-lvl">1</span></div>
        </div>
        <div style="text-align:right;">
            <div class="stat-label">TOTAL XP</div>
            <div class="stat-value"><span id="home-score">0</span> XP</div>
        </div>
    </div>

    <div class="hero-card">
        <div class="hook-box">
            <div class="pain-point">😰 ইংরেজিতে কথা বলতে গিয়ে আটকে যাচ্ছেন?</div>
            <div class="achievement-hook">🚀 জড়তা কাটান, ক্যারিয়ার গড়ুন!</div>
        </div>

        <div class="section-label">SELECT YOUR LEVEL</div>

        <div class="skill-grid">
            <div class="skill-option" onclick="selectSkill('A', this)">
                <div class="skill-head">Beginner</div>
                <div class="skill-sub">Zero to Hero</div>
            </div>
            <div class="skill-option" onclick="selectSkill('B', this)">
                <div class="skill-head">Learner</div>
                <div class="skill-sub">Basic Grammar</div>
            </div>
            <div class="skill-option" onclick="selectSkill('C', this)">
                <div class="skill-head">Hesitant</div>
                <div class="skill-sub">Shy Speaker</div>
            </div>
            <div class="skill-option" onclick="selectSkill('D', this)">
                <div class="skill-head">IELTS / GRE</div>
                <div class="skill-sub">High Band</div>
            </div>
            <div class="skill-option" onclick="selectSkill('E', this)">
                <div class="skill-head">Professional</div>
                <div class="skill-sub">Business & Corp</div>
            </div>
        </div>

        <button class="btn-start" onclick="startSession()">🚀 START MAGIC</button>
        <button id="install-btn" onclick="installApp()">📲 Download App</button>
    </div>
</div>

<div id="chat-screen">
    <div class="top-nav">
        <div class="level-badge" id="chat-lvl-badge">LVL 1</div>
        <div class="progress-container">
            <div class="progress-track"><div class="progress-fill" id="xp-bar"></div></div>
        </div>
    </div>
    <div id="messages"></div>
    <div class="bottom-area">
        <div class="input-deck">
            <button id="mic-btn" onclick="toggleMic()">🎙️</button>
            <input type="text" id="userInput" class="input-box" placeholder="Type or Speak..." onkeypress="handleEnter(event)">
        </div>
    </div>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com"; 
    let USER_ID = localStorage.getItem('talk24_uid');
    if (!USER_ID) { USER_ID = 'ID-' + Math.floor(100000 + Math.random() * 900000); localStorage.setItem('talk24_uid', USER_ID); }
    let state = { skill: null, level: 1, score: 0 };
    const play = (id) => { const a = document.getElementById(id); if(a){ a.currentTime=0; a.play().catch(()=>{}); } };

    window.onload = async () => {
        try {
            const res = await fetch(`${SERVER_URL}/api/stats`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({userId: USER_ID}) });
            const data = await res.json();
            updateStatsUI(data.score, data.level);
        } catch(e) {}
    };

    function updateStatsUI(score, level) {
        state.score = score; state.level = level;
        document.getElementById('home-score').innerText = score;
        document.getElementById('home-lvl').innerText = level;
        document.getElementById('chat-lvl-badge').innerText = `LVL ${level}`;
        document.getElementById('xp-bar').style.width = `${(score % 1000 / 1000) * 100}%`;
    }

    function selectSkill(code, el) {
        play('snd-click');
        document.querySelectorAll('.skill-option').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
        state.skill = code;
    }

    function startSession() {
        if (!state.skill) return alert("Select a Level!");
        play('snd-click');
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        callAPI({ message: "Action!", systemInstruction: `Skill Level: ${state.skill}`, userId: USER_ID });
    }

    async function sendToAI(text) {
        if (!text.trim()) return;
        if (/[অ-ঔক-হ]/.test(text)) { alert("Only English allowed!"); return; }
        play('snd-click');
        addUserMsg(text);
        document.getElementById('userInput').value = '';
        callAPI({ message: text, systemInstruction: "Check grammar", userId: USER_ID });
    }

    async function callAPI(payload) {
        try {
            document.getElementById('mic-btn').classList.add('listening');
            const res = await fetch(`${SERVER_URL}/api/chat`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            document.getElementById('mic-btn').classList.remove('listening');
            if (data.score_added > 0) {
                play('snd-success');
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 }, colors: ['#00ffcc', '#ff2e63'] });
                const newLvl = Math.floor(data.new_total_score / 1000) + 1;
                if (newLvl > state.level) showLevelUp(newLvl);
                updateStatsUI(data.new_total_score, newLvl);
            }
            addAiMsg(data.reply, data.instruction);
        } catch (e) { document.getElementById('mic-btn').classList.remove('listening'); }
    }

    function addUserMsg(text) {
        const d = document.createElement('div'); d.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
        d.style.display='flex'; d.style.justifyContent='flex-end';
        document.getElementById('messages').appendChild(d);
        scrollToBottom();
    }

    function addAiMsg(text, note) {
        const d = document.createElement('div');
        let html = `<div class="bubble ai-bubble">${text}</div>`;
        if (note) html += `<div class="mentor-note">${note}</div>`;
        d.innerHTML = html;
        document.getElementById('messages').appendChild(d);
        scrollToBottom();
        const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; window.speechSynthesis.speak(u);
    }

    function showLevelUp(lvl) {
        play('snd-levelup');
        document.getElementById('new-level-display').innerText = lvl;
        document.getElementById('level-up-modal').style.display = 'flex';
        confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 } });
    }
    
    function closeLevelModal() { document.getElementById('level-up-modal').style.display = 'none'; }
    function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
    function handleEnter(e) { if(e.key === 'Enter') sendToAI(e.target.value); }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    async function installApp() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } else alert("Check browser menu to install."); }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRecognition ? new SpeechRecognition() : null;
    function toggleMic() {
        if (!recognition) return alert("Use Chrome for voice.");
        recognition.lang = 'en-US';
        recognition.start();
        recognition.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            document.getElementById('userInput').value = txt;
            sendToAI(txt);
        };
    }
</script>
</body>
</html>
