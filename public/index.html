<style>
    /* 🔥 Streak Animation Styling */
    .streak-box { display: flex; align-items: center; gap: 5px; background: rgba(255, 69, 0, 0.1); border: 1px solid #ff4500; padding: 5px 10px; border-radius: 20px; color: #ff4500; font-weight: 900; font-size: 12px; animation: glow 2s infinite alternate; }
    @keyframes glow { from { box-shadow: 0 0 5px #ff4500; } to { box-shadow: 0 0 15px #ff4500; } }
</style>

<div class="top-nav">
    <div class="badge" id="chat-lvl">LVL 1</div>
    <div class="streak-box" id="streak-display">🔥 0</div> <div class="progress-track"><div class="progress-fill" id="xp-bar"></div></div>
    <button onclick="location.reload()" style="background:#444; border:none; padding:8px; border-radius:8px; color:white; font-size:10px; cursor:pointer;">EXIT</button>
</div>

<script>
    // ... (Existing script setup)

    function updateUI(s, streak = 0) {
        state.score = s;
        const lvl = Math.floor(s/1000)+1;
        document.getElementById('chat-lvl').innerText = `LVL ${lvl}`;
        document.getElementById('xp-bar').style.width = `${(s % 1000 / 1000) * 100}%`;
        
        // Update Streak Display
        document.getElementById('streak-display').innerText = `🔥 ${streak}`;
        if(streak >= 3) {
             document.getElementById('streak-display').style.background = "#ff4500";
             document.getElementById('streak-display').style.color = "white";
        }
    }

    async function callAPI(payload) {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            const data = await res.json();
            
            if(data.score_added > 0) {
                confetti({ particleCount: 30, origin: { y: 0.8 }, colors: ['#ff4500', '#ffd700'] });
                updateUI(data.new_total_score, data.streak); // Passing streak to UI
            }
            
            // 🔥 Special Achievement Alert
            if(data.streak === 3 && payload.inputType === 'voice') {
                alert("🎉 Amazing! You are a '3-Day Speak Master'! Keep going!");
            }

            renderAiMsg(data.reply, data.performance, data.notes);
        } catch(e) {}
    }

    // Initial load from stats endpoint
    window.onload = async () => {
        const res = await fetch(`${SERVER_URL}/api/stats`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: USER_ID}) });
        const data = await res.json();
        updateUI(data.score, data.streak);
    };
</script>
