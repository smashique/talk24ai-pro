<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Spoken English Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #002b20; --card: #001e17; --cyan: #00ffcc; --gold: #ffd700; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .app-header { background: var(--card); padding: 12px 15px; border-bottom: 2px solid #004d40; display: flex; justify-content: space-between; align-items: center; }
        .nav-actions { display: flex; gap: 8px; }
        
        /* App Button Highlight Animation */
        .action-btn { background: var(--cyan); color: black; border: none; padding: 7px 12px; border-radius: 20px; font-weight: 800; font-size: 10px; cursor: pointer; transition: 0.3s; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px var(--cyan); } 50% { box-shadow: 0 0 20px var(--cyan); transform: scale(1.05); } }
        .highlight-active { animation: glow 0.8s ease-in-out 4; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 110px; }
        .bubble { padding: 15px; border-radius: 18px; font-size: 16px; max-width: 85%; line-height: 1.5; }
        .ai-bubble { background: #00382e; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-bubble { background: #005f6b; align-self: flex-end; border-bottom-right-radius: 2px; }
        .word-hl { color: var(--gold); font-weight: 900; background: rgba(255, 215, 0, 0.1); }

        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 20px; display: flex; justify-content: center; background: linear-gradient(transparent, var(--bg) 50%); }
        #mic-btn { width: 70px; height: 70px; border-radius: 50%; background: #00382e; border: 4px solid var(--cyan); color: var(--cyan); font-size: 28px; cursor: pointer; }
        #mic-btn.active { border-color: #ff4500; color: #ff4500; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }
    </style>
</head>
<body>

<header class="app-header">
    <div>
        <div style="color:var(--cyan); font-weight:900;">Talk24AI</div>
        <select id="mode-selector" onchange="changeMode(this.value)" style="background:none; color:var(--cyan); border:none; font-size:11px; font-weight:700; cursor:pointer;">
            <option value="Junior">Junior</option>
            <option value="Senior" selected>Senior</option>
            <option value="Pro">Pro</option>
        </select>
    </div>
    <div class="nav-actions">
        <button id="btn-app" class="action-btn">DOWNLOAD APP</button>
        <button class="action-btn" style="background:var(--gold);" onclick="downloadPDF()">DOWNLOAD NOTE</button>
    </div>
</header>

<div id="messages"></div>
<div class="bottom-area"><button id="mic-btn" onclick="toggleMic()">🎙️</button></div>

<script>
    const SERVER_URL = window.location.origin;
    let UID = localStorage.getItem('t24_uid') || 'U-' + Date.now();
    localStorage.setItem('t24_uid', UID);
    let currentMode = localStorage.getItem('t24_mode') || 'Senior';
    let chatLog = [];

    // 🔔 Halal Chime Sound (Digital Synth)
    function playChime() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.6);
        } catch(e) {}
    }

    async function callAPI(msg, type = 'click') {
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ message: msg, userId: UID, inputType: type, mode: currentMode })
            });
            const data = await res.json();
            if(type === 'voice') {
                playChime();
                const b = document.getElementById('btn-app');
                b.classList.add('highlight-active');
                setTimeout(() => b.classList.remove('highlight-active'), 3500);
            }
            renderMsg(data.reply, 'ai');
        } catch(e) { renderMsg("Ready! 1. Yes, 2. No", 'ai'); }
    }

    function renderMsg(txt, sender) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-bubble`;
        
        const words = txt.split(' ');
        div.innerHTML = `<div class="txt-box">` + words.map(w => `<span>${w} </span>`).join('') + `</div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        
        if(sender === 'ai') speak(txt, div.querySelector('.txt-box'));
        chatLog.push({ s: sender, t: txt, d: new Date().toLocaleString() });
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16); doc.text("Talk24AI Practice Notes", 20, 20);
        doc.setFontSize(10);
        let y = 35;
        chatLog.forEach(log => {
            if(y > 270) { doc.addPage(); y = 20; }
            doc.setFont("helvetica", "bold");
            doc.text(`${log.s.toUpperCase()} (${log.d}):`, 20, y);
            doc.setFont("helvetica", "normal");
            const lines = doc.splitTextToSize(log.t, 170);
            doc.text(lines, 20, y + 5);
            y += (lines.length * 5) + 12;
        });
        doc.save(`Notes_${Date.now()}.pdf`);
    }

    function speak(text, element) {
        const ut = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        ut.voice = voices.find(v => v.name.includes('Male')) || voices[0];
        ut.rate = currentMode === 'Junior' ? 0.85 : 1.0;
        const spans = element.querySelectorAll('span');
        let idx = 0;
        ut.onboundary = (e) => {
            if (e.name === 'word' && spans[idx]) {
                spans.forEach(s => s.classList.remove('word-hl'));
                spans[idx].classList.add('word-hl'); idx++;
            }
        };
        window.speechSynthesis.speak(ut);
    }

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = Recognition ? new Recognition() : null;
    function toggleMic() {
        if(!rec) return;
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        rec.start();
        rec.onresult = (e) => {
            btn.classList.remove('active');
            const t = e.results[0][0].transcript;
            renderMsg(t, 'user'); callAPI(t, 'voice');
        };
        rec.onerror = () => btn.classList.remove('active');
    }

    window.onload = () => { callAPI("Hello, I am ready to start.", 'click'); };
    function changeMode(m) { currentMode = m; localStorage.setItem('t24_mode', m); renderMsg(`System: Switched to ${m} mode.`, 'ai'); }
</script>
</body>
</html>
