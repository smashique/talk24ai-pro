<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | Professional Spoken English Lab</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --bg: #002b20; 
            --card: #001e17; 
            --input: #00382e; 
            --cyan: #00ffcc; 
            --gray: #aabeb8; 
            --gold: #ffd700; 
            --user-bubble: #005f6b;
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Level Selection Modal */
        #intro-modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 999; 
            backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: var(--card); 
            border: 2px solid var(--cyan); 
            width: 90%; 
            max-width: 400px; 
            padding: 35px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
        }
        
        .mode-selection { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 25px; 
        }
        .mode-btn { 
            background: var(--input); 
            border: 1px solid var(--cyan); 
            color: white; 
            padding: 15px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 14px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .mode-btn:hover { 
            background: var(--cyan); 
            color: black; 
            transform: scale(1.03);
        }

        /* Header UI */
        .app-header { 
            background: var(--card); 
            padding: 12px 20px; 
            border-bottom: 2px solid #004d40; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        #mode-selector { 
            background: var(--input); 
            color: var(--cyan); 
            border: 1px solid var(--cyan); 
            border-radius: 8px; 
            font-size: 12px; 
            padding: 6px; 
            font-weight: 700; 
            outline: none;
        }

        /* Chat Area */
        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding-bottom: 120px; 
            scroll-behavior: smooth;
        }
        .bubble { 
            padding: 15px 20px; 
            border-radius: 20px; 
            font-size: 16px; 
            max-width: 85%; 
            line-height: 1.5; 
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .ai-bubble { background: var(--input); border: 1px solid #004d40; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-bubble { background: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .highlight { 
            color: var(--gold); 
            font-weight: 900; 
            background: rgba(255, 215, 0, 0.15); 
            border-radius: 4px; 
            padding: 0 3px; 
            transition: 0.1s;
        }

        /* Choice Buttons for Quizzes */
        .choice-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .choice-btn { 
            background: rgba(0, 255, 204, 0.05); 
            border: 1.5px solid var(--cyan); 
            color: var(--cyan); 
            padding: 10px 18px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 14px;
            transition: 0.2s;
        }
        .choice-btn:hover { 
            background: var(--cyan); 
            color: black; 
        }

        /* Mic Button Area */
        .bottom-area { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            padding: 25px 0; 
            display: flex; 
            justify-content: center; 
            background: linear-gradient(transparent, var(--bg) 40%);
        }
        #mic-btn { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            background: var(--input); 
            border: 4px solid var(--cyan); 
            color: var(--cyan); 
            font-size: 28px; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #mic-btn.active { 
            border-color: #ff4500; 
            color: #ff4500; 
            animation: pulse 1.5s infinite; 
            transform: scale(1.1);
        }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.4); } 
            70% { box-shadow: 0 0 0 20px rgba(255, 69, 0, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0); } 
        }
    </style>
</head>
<body>

<div id="intro-modal">
    <div class="modal-content">
        <h2 style="color:var(--cyan); margin-top:0;">English Lab</h2>
        <p style="color:var(--gray);">Choose your expertise level to begin your speaking journey.</p>
        <div class="mode-selection">
            <button class="mode-btn" onclick="setMode('Junior')">👶 JUNIOR (Beginner)</button>
            <button class="mode-btn" onclick="setMode('Senior')">👨‍🎓 SENIOR (Intermediate)</button>
            <button class="mode-btn" onclick="setMode('Pro')">🚀 PRO (Advanced)</button>
        </div>
    </div>
</div>

<header class="app-header">
    <div style="display:flex; flex-direction:column;">
        <div style="color:var(--cyan); font-size:22px; font-weight:900; letter-spacing:1px;">Talk24AI</div>
        <select id="mode-selector" onchange="changeMode(this.value)">
            <option value="Junior">Junior Mode</option>
            <option value="Senior">Senior Mode</option>
            <option value="Pro">Pro Mode</option>
        </select>
    </div>
    <div style="text-align:right;">
        <div style="font-weight:900; font-size:14px; color:var(--gold);">XP POINTS</div>
        <div id="xp-val" style="font-size:20px; font-weight:900; color:white;">0</div>
    </div>
</header>

<div id="messages"></div>

<div class="bottom-area">
    <button id="mic-btn" onclick="toggleMic()">🎙️</button>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let UID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', UID);
    
    let currentMode = localStorage.getItem('talk24_mode') || 'Senior';

    // Initialize Mode
    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('talk24_mode', mode);
        document.getElementById('mode-selector').value = mode;
        document.getElementById('intro-modal').style.display = 'none';
        
        // Initial Trigger to start the English Conversation
        callAPI({ 
            message: `Hi Mentor! I am starting in ${mode} mode. Let's learn!`, 
            userId: UID, 
            inputType: 'click', 
            mode: mode 
        });
    }

    // Switch Mode during session
    function changeMode(mode) {
        currentMode = mode;
        localStorage.setItem('talk24_mode', mode);
        renderMsg(`System: Level updated to ${mode}. AI is adjusting...`, 'ai');
        callAPI({ 
            message: `I have switched my level to ${mode}. Please guide me accordingly.`, 
            userId: UID, 
            inputType: 'click', 
            mode: mode 
        });
    }

    // API Interaction
    async function callAPI(payload) {
        payload.mode = currentMode;
        try {
            const res = await fetch(`${SERVER_URL}/api/chat`, { 
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify(payload) 
            });
            const data = await res.json();
            
            if(data.score_added > 0) {
                const xpSpan = document.getElementById('xp-val');
                xpSpan.innerText = data.new_total_score;
                if(payload.inputType === 'voice') triggerConfetti();
            }
            renderMsg(data.reply, 'ai');
        } catch(e) { 
            renderMsg("Connection synced. Let's keep practicing! [Yes! | Sure]", 'ai'); 
        }
    }

    // UI Rendering Logic
    function renderMsg(txt, sender) {
        const box = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `bubble ${sender}-bubble`;
        
        let displayTxt = txt;
        const optionsMatch = txt.match(/\[(.*?)\]/); // Find [Option 1 | Option 2]
        
        if(sender === 'ai') {
            // Remove the brackets part from the spoken text
            if(optionsMatch) displayTxt = txt.replace(optionsMatch[0], "").trim();
            
            const words = displayTxt.split(' ');
            d.innerHTML = `<div class="speech-text">` + 
                words.map(w => `<span>${w} </span>`).join('') + 
                `</div>`;
            
            // Add Choice Buttons
            if(optionsMatch) {
                const choiceDiv = document.createElement('div');
                choiceDiv.className = 'choice-container';
                optionsMatch[1].split('|').forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = opt.trim();
                    btn.onclick = () => {
                        renderMsg(opt.trim(), 'user');
                        callAPI({ message: opt.trim(), userId: UID, inputType: 'click' });
                    };
                    choiceDiv.appendChild(btn);
                });
                d.appendChild(choiceDiv);
            }
        } else {
            d.innerText = txt;
        }

        box.appendChild(d);
        box.scrollTop = box.scrollHeight;

        // Auto-speak AI response
        if(sender === 'ai' && !txt.startsWith('System:')) {
            speak(displayTxt, d.querySelector('.speech-text'));
        }
    }

    // Text to Speech with Highlight
    function speak(text, element) {
        if (!element || !('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel(); // Stop previous speech
        const ut = new SpeechSynthesisUtterance(text);
        
        // Voice Selection (Prefer Male)
        const voices = window.speechSynthesis.getVoices();
        ut.voice = voices.find(v => v.name.includes('Male') || v.name.includes('Google US English')) || voices[0];
        
        // Speed adjustment based on Mode
        ut.rate = (currentMode === 'Junior') ? 0.85 : 1.0;
        ut.pitch = 1.0;

        const spans = element.querySelectorAll('span');
        let wordIndex = 0;

        ut.onboundary = (event) => {
            if (event.name === 'word' && wordIndex < spans.length) {
                spans.forEach(s => s.classList.remove('highlight'));
                if(spans[wordIndex]) spans[wordIndex].classList.add('highlight');
                wordIndex++;
            }
        };

        ut.onend = () => spans.forEach(s => s.classList.remove('highlight'));
        window.speechSynthesis.speak(ut);
    }

    // Speech Recognition
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = Recognition ? new Recognition() : null;

    function toggleMic() {
        if(!recognizer) return alert("Speech Recognition not supported in this browser.");
        
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        
        recognizer.start();
        
        recognizer.onresult = (e) => {
            btn.classList.remove('active');
            const transcript = e.results[0][0].transcript;
            renderMsg(transcript, 'user');
            callAPI({ message: transcript, userId: UID, inputType: 'voice' });
        };

        recognizer.onerror = () => btn.classList.remove('active');
        recognizer.onspeechend = () => recognizer.stop();
    }

    function triggerConfetti() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#00ffcc', '#ffd700', '#ffffff'] });
    }

    // Pre-load voices
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
