<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk24AI | #1 Spoken Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #002b20; --card: #001e17; --input: #00382e; --cyan: #00ffcc; --gray: #aabeb8; --fire: #ff4500; --gold: #ffd700; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg); color: white; height: 100vh; overflow: hidden; }
        
        /* 📱 Header & Stats Area */
        .app-header { background: var(--card); padding: 10px 15px; border-bottom: 2px solid #004d40; display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .user-meta { font-size: 10px; color: var(--gray); font-weight: bold; }
        .stats-row { display: flex; gap: 10px; align-items: center; }
        .badge { background: var(--input); border: 1px solid var(--cyan); padding: 4px 10px; border-radius: 20px; color: var(--cyan); font-weight: 900; font-size: 11px; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; height: calc(100vh - 180px); }
        .bubble { padding: 14px 18px; border-radius: 18px; font-size: 15px; max-width: 85%; line-height: 1.5; animation: fadeIn 0.3s; }
        .ai-bubble { background: var(--input); align-self: flex-start; border: 1px solid #004d40; border-bottom-left-radius: 2px; }
        .user-bubble { background: linear-gradient(135deg, #00b4db, #0083b0); align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .bottom-area { position: fixed; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(to top, var(--bg) 80%, transparent); display: flex; justify-content: center; backdrop-filter: blur(10px); }
        #mic-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--input); border: 4px solid var(--cyan); color: var(--cyan); font-size: 30px; cursor: pointer; position: relative; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<header class="app-header">
    <div class="top-row">
        <div style="font-family:'Fredoka'; color:var(--cyan); font-size:22px;">Talk24AI</div>
        <button onclick="alert('Open browser menu > Install/Add to Home Screen')" style="background:var(--cyan); color:black; border:none; padding:5px 12px; border-radius:15px; font-weight:900; font-size:10px;">📲 DOWNLOAD APP</button>
    </div>
    <div class="top-row">
        <div class="user-meta">UID: <span id="display-uid">...</span></div>
        <div class="stats-row">
            <div id="streak-box" style="color:var(--fire); font-weight:900; font-size:12px;">🔥 0</div>
            <div id="chat-lvl" class="badge">LVL 1</div>
            <div style="font-size:11px; color:var(--gold); font-weight:900;">XP: <span id="home-xp">0</span></div>
        </div>
    </div>
</header>

<div id="messages"></div>

<div class="bottom-area">
    <button id="mic-btn" onclick="toggleMic()">🎙️</button>
</div>

<script>
    const SERVER_URL = "https://talk24ai.onrender.com";
    let USER_ID = localStorage.getItem('talk24_uid') || 'ID-' + Math.floor(Math.random() * 900000);
    localStorage.setItem('talk24_uid', USER_ID);
    document.getElementById('display-uid').innerText = USER_ID;

    let state = { score: parseInt(localStorage.getItem('talk24_score')) || 0 };

    window.onload = async () => {
        updateUI(state.score);
        // অ্যাপ খুললেই চ্যাট শুরু হবে
        callAPI({ message: "Action!", userId: USER_ID, inputType: 'click' });
    };

    function updateUI(s, streak = 0) {
        state.score = s; localStorage.setItem('talk24_score', s);
        const lvl = Math.floor(s/1000)+1;
        document.getElementById('home-xp').innerText = s;
        document.getElementById('chat-lvl').innerText = `LVL ${lvl}`; 
        document.getElementById('streak-box').innerText = `🔥 ${streak}`;
    }

    async function callAPI(payload) {
        const res = await fetch(`${SERVER_URL}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if(data.score_added > 0) { document.getElementById('snd-success').play(); updateUI(data.new_total_score, data.streak); }
        renderAiMsg(data.reply);
    }

    function renderAiMsg(reply) {
        const box = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = 'bubble ai-bubble';
        d.innerText = reply;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        speak(reply);
    }

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        // পুরুষ কণ্ঠ সিলেক্ট করার চেষ্টা
        const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google uk english male')) || voices[0];
        utterance.voice = maleVoice;
        utterance.rate = 0.9; // একটু ধীর গতি যাতে বাচ্চারা বোঝে
        window.speechSynthesis.speak(utterance);
    }

    const rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = rec ? new rec() : null;
    function toggleMic() {
        if(!recognition) return alert("Mic not supported.");
        recognition.start();
        recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            const u = document.createElement('div'); u.className = 'bubble user-bubble'; u.innerText = transcript;
            document.getElementById('messages').appendChild(u);
            callAPI({ message: transcript, userId: USER_ID, inputType: 'voice' });
        }
    }
</script>
</body>
</html>
