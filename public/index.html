<style>
    /* ... (অন্যান্য স্টাইল ঠিক থাকবে) ... */

    /* 🧑‍🏫 AI TEACHER VIEW - FIX */
    #ai-viewport { 
        flex: 1; 
        position: relative; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        overflow: hidden;
        background: linear-gradient(135deg, #00382e, #001e17); /* Fallback background color */
    }

    #ai-avatar { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
        opacity: 0.9; 
        transition: transform 0.3s;
        /* Image fallback logic */
        background-color: #002b20; 
    }

    /* ... (অন্যান্য স্টাইল ঠিক থাকবে) ... */
</style>

<script>
    /* ... (অন্যান্য কোড ঠিক থাকবে) ... */

    // 🚀 NEW ROBUST ASSETS (Using more reliable links)
    const TRACK_THEMES = {
        'A': { img: "https://images.unsplash.com/photo-1544717305-27a734ef4164?q=80&w=1000&auto=format&fit=crop", label: "Magic Teacher" },
        'B': { img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1000&auto=format&fit=crop", label: "Dynamic Coach" },
        'C': { img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=1000&auto=format&fit=crop", label: "Partner" },
        'D': { img: "https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=1000&auto=format&fit=crop", label: "Examiner" },
        'E': { img: "https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?q=80&w=1000&auto=format&fit=crop", label: "Executive" }
    };

    async function startVideoSession() {
        if (!state.skill) return alert("Please select a Track first!");
        
        const avatarImg = document.getElementById('ai-avatar');
        avatarImg.src = TRACK_THEMES[state.skill].img;

        // 🛡️ ERROR HANDLER: If image fails, show a placeholder color
        avatarImg.onerror = function() {
            this.style.display = 'none'; // Hide broken image icon
            document.getElementById('ai-viewport').style.background = "linear-gradient(45deg, #004d40, #002b20)";
        };
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('user-preview').srcObject = stream;
        } catch (e) { console.log("Camera blocked, continuing with AI only."); }

        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('video-screen').style.display = 'flex';
        callAcademyAPI("Action!");
    }
    /* ... (বাকি ফাংশনগুলো আগের মতোই থাকবে) ... */
</script>
